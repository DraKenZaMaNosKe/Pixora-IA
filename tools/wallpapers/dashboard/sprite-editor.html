window.toggleDrawer = (which) => {
  const other = which === 'left' ? 'right' : 'left';
  $(`#${other}`).classList.remove('open');
  $(`#${which}`).classList.toggle('open');
};
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.target.matches('input, textarea, select')) {
    e.preventDefault();
    spaceHeld = true;
    $('#stage').classList.add('space-pan');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'a' && isSceneEditing()) {
    e.preventDefault();
    selectAllEditable();
    return;
  }
  if (!isSceneEditing() || !state.selection.length) return;
  const step = e.shiftKey ? 10 : 1;
  const arrows = {ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step]};
  if (!arrows[e.key]) return;
  e.preventDefault();
  const [dx, dy] = arrows[e.key];
  const snaps = snapshotSelectionForDrag();
  applyDragDelta(snaps, dx, dy);
  markDirty(); renderItemsPanel(); updateStatusBar(); pushHistory();
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceHeld = false;
    $('#stage').classList.remove('space-pan');
  }
});

$('#tool-grid').onclick = () => {
  state.showGrid = !state.showGrid;
  $('#grid-overlay').classList.toggle('on', state.showGrid);
  $('#tool-grid').classList.toggle('active', state.showGrid);
};
$('#tool-ref').onclick = async () => {
  if (!SC.hasParallaxLayers(state.spec)) {
    toast('Sin image_layers — flat bg ya es la vista principal', 'ok');
    return;
  }
  state.showReferenceBg = !state.showReferenceBg;
  $('#tool-ref').classList.toggle('active', state.showReferenceBg);
  await rebuildScene();
  toast(state.showReferenceBg
    ? 'REF ON — flat semitransparente (solo comparar)'
    : 'REF OFF — WYSIWYG como el cel (capas + sprites)', 'ok');
};
$('#tool-blink').onclick = async () => {
  state.hideBlinkFrames = !state.hideBlinkFrames;
  $('#tool-blink').classList.toggle('active', state.hideBlinkFrames);
  await rebuildScene(); renderItemsPanel(); updateStatusBar();
};
$('#tool-sync').onclick = () => {
  state.syncCycleLayers = !state.syncCycleLayers;
  $('#tool-sync').classList.toggle('active', state.syncCycleLayers);
  toast(state.syncCycleLayers ? 'Sync ON — mueve grupo (capas cycle + sprites manifest)' : 'Sync OFF — item individual', 'ok');
};
$('#tool-copy').onclick = () => {
  if (!isSceneEditing()) return;
  const lines = [];
  (state.spec.sprites || []).forEach(sp => {
    lines.push(`sprite ${sp.name}: x=${sp.params.x.toFixed(4)} y=${sp.params.y.toFixed(4)} scale=${sp.params.scale.toFixed(5)}`);
  });
  (state.spec.image_layers || [])
    .filter(l => l.key !== 'bg')
    .forEach(l => {
      lines.push(`layer ${l.key}: offset_x=${l.offset_x_px||0} offset_y=${l.offset_y_px||0} scale=${l.scale||1}`);
    });
  if (!lines.length) { toast('Nada que copiar', 'error'); return; }
  navigator.clipboard.writeText(lines.join('\n'));
  toast(`${lines.length} items copiados`, 'ok');
};
$('#tool-grpall').onclick = () => {
  if (!getPrimarySelection()) { toast('Selecciona capa o sprite primero', 'error'); return; }
  selectGroupOfPrimary();
};
$('#tool-selall').onclick = () => selectAllEditable();

// ═════════════════════════════════════════════════════════════════════
// IMAGE IMPORT (device adb + PC upload)
// ═════════════════════════════════════════════════════════════════════

const importState = {
  mode: 'layer',   // layer | sprite
  tab: 'device',   // device | pc
  images: [],
  selectedPath: null,
  pcFile: null,
  busy: false,
};

const LAYER_ACTIONS = [
  ['replace_layer', 'Reemplazar capa seleccionada'],
  ['add_layer', 'Nueva capa'],
  ['background', 'Fondo flat (background.url)'],
];
const SPRITE_ACTIONS = [
  ['replace_sprite', 'Reemplazar sprite seleccionado'],
  ['add_sprite', 'Nuevo sprite'],
];

function formatBytes(n) {
  if (!n) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function getImportTargetLayerKey() {
  const p = getPrimarySelection();
  if (p?.kind === 'layer') {
    const l = state.spec?.image_layers?.[p.idx];
    return l?.key || '';
  }
  return '';
}

function getImportTargetSprite() {
  const p = getPrimarySelection();
  if (p?.kind === 'sprite') return state.spec?.sprites?.[p.idx] || null;
  return null;
}

function fillImportActionSelect() {
  const sel = $('#import-action');
  const opts = importState.mode === 'sprite' ? SPRITE_ACTIONS : LAYER_ACTIONS;
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
}

function syncImportActionUi() {
  const isSprite = importState.mode === 'sprite';
  $('#import-title').textContent = isSprite ? 'SPRITE PACK' : 'CAPAS / IMÁGENES';
  $('#import-pc-hint').textContent = isSprite
    ? 'ZIP con frame_001.png … frame_NNN.png (salida de extracción GIF/video)'
    : 'JPG · PNG · WebP — se convierte a WebP y sube a Supabase';
  $('#import-pc-file').accept = isSprite ? '.zip,application/zip' : 'image/*';

  const action = $('#import-action').value;
  const layerKeyInp = $('#import-layer-key');
  const spriteNameInp = $('#import-sprite-name');
  const frameSkipInp = $('#import-frame-skip');
  const hint = $('#import-hint');

  layerKeyInp.style.display = 'none';
  spriteNameInp.style.display = 'none';
  frameSkipInp.style.display = 'none';

  if (isSprite) {
    frameSkipInp.style.display = '';
    if (action === 'add_sprite') {
      spriteNameInp.style.display = '';
      spriteNameInp.placeholder = 'ej. orb, fire';
      hint.innerHTML = 'Sube ZIP → manifest + nuevo sprite en spec · ajusta X/Y después';
    } else {
      const sp = getImportTargetSprite();
      hint.innerHTML = sp
        ? `Reemplaza <strong>${escapeHtml(sp.name)}</strong> (${escapeHtml(sp.manifest_key)})`
        : 'Selecciona un sprite en el panel';
    }
  } else if (action === 'add_layer') {
    layerKeyInp.style.display = '';
    layerKeyInp.placeholder = 'nombre_capa';
    hint.textContent = 'Nueva image_layer en el spec';
  } else if (action === 'replace_layer') {
    const k = getImportTargetLayerKey();
    hint.innerHTML = k
      ? `Reemplaza capa <strong>${escapeHtml(k)}</strong>`
      : 'Selecciona una capa';
  } else {
    hint.textContent = 'Actualiza background.url (flat referencia)';
  }
  updateImportApplyBtn();
}

function updateImportApplyBtn() {
  const btn = $('#import-apply');
  const action = $('#import-action').value;
  const isSprite = importState.mode === 'sprite';
  const hasSrc = importState.tab === 'device'
    ? !!importState.selectedPath
    : !!importState.pcFile;
  let ok = hasSrc && !!state.selectedId && !importState.busy;
  if (isSprite) {
    if (action === 'replace_sprite' && !getImportTargetSprite()) ok = false;
    if (action === 'add_sprite' && !($('#import-sprite-name').value || '').trim()) ok = false;
    if (importState.tab === 'device') {
      const item = importState.images.find(i => i.path === importState.selectedPath);
      if (item && item.kind !== 'sprite_pack') ok = false;
    } else if (importState.pcFile && !importState.pcFile.name.toLowerCase().endsWith('.zip')) {
      ok = false;
    }
  } else {
    if (action === 'replace_layer' && !getImportTargetLayerKey()) ok = false;
    if (action === 'add_layer' && !($('#import-layer-key').value || '').trim()) ok = false;
    if (importState.tab === 'device') {
      const item = importState.images.find(i => i.path === importState.selectedPath);
      if (item && item.kind === 'sprite_pack') ok = false;
    }
  }
  btn.disabled = !ok;
}

async function loadDeviceImages() {
  $('#import-loading').style.display = 'block';
  $('#import-loading').textContent = 'escaneando cel…';
  $('#import-grid').style.display = 'none';
  try {
    const r = await fetch('/api/device-images');
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    importState.images = j.images || [];
    $('#import-hint').innerHTML = j.hint
      ? `${j.hint} · <strong>${j.inbox || '/sdcard/Pixora/inbox'}</strong>`
      : 'Pixora/inbox en el cel';
    renderDeviceImageGrid();
  } catch (e) {
    $('#import-loading').textContent = 'sin adb: ' + e.message;
    importState.images = [];
  }
}

function filteredDeviceItems() {
  const wantPack = importState.mode === 'sprite';
  return importState.images.filter(i =>
    wantPack ? i.kind === 'sprite_pack' : i.kind !== 'sprite_pack',
  );
}

function renderDeviceImageGrid() {
  const grid = $('#import-grid');
  grid.innerHTML = '';
  const items = filteredDeviceItems();
  if (!items.length) {
    $('#import-loading').style.display = 'block';
    $('#import-loading').textContent = importState.mode === 'sprite'
      ? 'sin ZIP en cel — copia tu pack a Pixora/inbox'
      : 'sin imágenes — guarda en Pixora/inbox';
    grid.style.display = 'none';
    return;
  }
  $('#import-loading').style.display = 'none';
  grid.style.display = 'grid';
  const serial = state.device?.serial ? `&serial=${encodeURIComponent(state.device.serial)}` : '';
  items.forEach(img => {
    const card = document.createElement('div');
    card.className = 'import-card' + (importState.selectedPath === img.path ? ' selected' : '');
    const thumb = img.kind === 'sprite_pack'
      ? '<div class="zip-thumb">🎞</div>'
      : `<img loading="lazy" alt="" src="/api/device-image-preview?path=${encodeURIComponent(img.path)}${serial}">`;
    card.innerHTML = `${thumb}
      <div class="meta" title="${escapeHtml(img.path)}">${escapeHtml(img.name)} · ${formatBytes(img.size)}</div>`;
    card.onclick = () => {
      importState.selectedPath = img.path;
      $$('.import-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      updateImportApplyBtn();
    };
    grid.appendChild(card);
  });
}

function setImportMode(mode) {
  importState.mode = mode;
  importState.selectedPath = null;
  importState.pcFile = null;
  $('#import-pc-name').textContent = '';
  $('#import-pc-file').value = '';
  $$('[data-import-mode]').forEach(t =>
    t.classList.toggle('active', t.dataset.importMode === mode));
  fillImportActionSelect();
  const sp = getImportTargetSprite();
  const layer = getImportTargetLayerKey();
  if (mode === 'sprite') {
    $('#import-action').value = sp ? 'replace_sprite' : 'add_sprite';
  } else {
    $('#import-action').value = layer ? 'replace_layer' : 'add_layer';
  }
  syncImportActionUi();
  if (importState.tab === 'device') renderDeviceImageGrid();
}

function setImportTab(tab) {
  importState.tab = tab;
  $$('[data-import-tab]').forEach(t => t.classList.toggle('active', t.dataset.importTab === tab));
  const isDevice = tab === 'device';
  $('#import-pc-pane').style.display = isDevice ? 'none' : 'block';
  if (isDevice) {
    if (!importState.images.length) loadDeviceImages();
    else renderDeviceImageGrid();
  }
  updateImportApplyBtn();
}

function openImportModal() {
  if (!state.selectedId || !state.spec) {
    toast('Abre un canvas_scene primero', 'error');
    return;
  }
  importState.selectedPath = null;
  importState.pcFile = null;
  $('#import-pc-name').textContent = '';
  $('#import-pc-file').value = '';
  const sp = getImportTargetSprite();
  importState.mode = sp ? 'sprite' : (getImportTargetLayerKey() ? 'layer' : 'layer');
  $$('[data-import-mode]').forEach(t =>
    t.classList.toggle('active', t.dataset.importMode === importState.mode));
  fillImportActionSelect();
  if (importState.mode === 'sprite' && sp) {
    $('#import-action').value = 'replace_sprite';
  } else if (getImportTargetLayerKey()) {
    $('#import-action').value = 'replace_layer';
  }
  syncImportActionUi();
  $('#import-overlay').classList.add('open');
  setImportTab('device');
  if (!importState.images.length) loadDeviceImages();
}

function closeImportModal() {
  $('#import-overlay').classList.remove('open');
}

async function applySceneImport() {
  if (!state.selectedId || importState.busy) return;
  const action = $('#import-action').value;
  const isSprite = importState.mode === 'sprite';
  importState.busy = true;
  updateImportApplyBtn();
  $('#import-apply').textContent = 'Subiendo…';
  try {
    let summary;
    let targetMk = null;
    let targetLayerKey = null;

    if (isSprite) {
      const sp = getImportTargetSprite();
      const spriteName = ($('#import-sprite-name').value || '').trim();
      const frameSkip = parseFloat($('#import-frame-skip').value) || 2;
      if (importState.tab === 'device') {
        if (!importState.selectedPath) throw new Error('elige un ZIP del cel');
        const r = await fetch('/api/device-import-sprite', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            scene_id: state.selectedId,
            device_path: importState.selectedPath,
            serial: state.device?.serial,
            action,
            manifest_key: action === 'replace_sprite' ? sp?.manifest_key : undefined,
            sprite_name: action === 'add_sprite' ? spriteName : undefined,
            frame_skip: frameSkip,
          }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'sprite import failed');
        summary = j;
      } else {
        if (!importState.pcFile) throw new Error('elige un ZIP');
        const fd = new FormData();
        fd.append('file', importState.pcFile);
        fd.append('scene_id', state.selectedId);
        fd.append('action', action);
        fd.append('frame_skip', String(frameSkip));
        if (action === 'replace_sprite' && sp) fd.append('manifest_key', sp.manifest_key);
        if (action === 'add_sprite') fd.append('sprite_name', spriteName);
        const r = await fetch('/api/import-sprite-pack', {method: 'POST', body: fd});
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'upload failed');
        summary = j;
      }
      if (summary.sprites) state.spec.sprites = summary.sprites;
      state.spriteCacheBust = Date.now();
      targetMk = summary.manifest_key || summary.sprite?.manifest_key || (action === 'replace_sprite' ? (sp && sp.manifest_key) : null);
      // pequeño delay para que el storage propague el manifest + zip nuevo antes del fetch de frames
      await new Promise(r => setTimeout(r, 250));
    } else {
      const layerKey = getImportTargetLayerKey();
      const newLayerKey = ($('#import-layer-key').value || '').trim();
      if (importState.tab === 'device') {
        if (!importState.selectedPath) throw new Error('elige una imagen del cel');
        const r = await fetch('/api/device-import-image', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            scene_id: state.selectedId,
            device_path: importState.selectedPath,
            serial: state.device?.serial,
            action,
            layer_key: action === 'replace_layer' ? layerKey : undefined,
            new_layer_key: action === 'add_layer' ? newLayerKey : undefined,
            z: (state.spec.image_layers?.length || 0),
          }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'import failed');
        summary = j;
      } else {
        if (!importState.pcFile) throw new Error('elige un archivo');
        const fd = new FormData();
        fd.append('file', importState.pcFile);
        fd.append('scene_id', state.selectedId);
        fd.append('action', action);
        if (action === 'replace_layer') fd.append('layer_key', layerKey);
        if (action === 'add_layer') fd.append('new_layer_key', newLayerKey);
        fd.append('z', String(state.spec.image_layers?.length || 0));
        const r = await fetch('/api/import-scene-image', {method: 'POST', body: fd});
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'upload failed');
        summary = j;
      }
      if (summary.image_layers) state.spec.image_layers = summary.image_layers;
      if (summary.background) state.spec.background = summary.background;
      targetLayerKey = summary.layer_key || (action === 'add_layer' ? newLayerKey : layerKey);
    }

    await rebuildScene();
    renderItemsPanel();
    markDirty();
    pushHistory();

    // Auto-select the just imported/replaced item so user can tweak position/params immediately
    let didAutoSelect = false;
    if (isSprite && targetMk && state.spec.sprites) {
      const idx = state.spec.sprites.findIndex(s => s && s.manifest_key === targetMk);
      if (idx >= 0) {
        selectOnly('sprite', idx);
        didAutoSelect = true;
      }
    } else if (!isSprite && targetLayerKey && state.spec.image_layers) {
      const idx = state.spec.image_layers.findIndex(l => l && l.key === targetLayerKey);
      if (idx >= 0) {
        selectOnly('layer', idx);
        didAutoSelect = true;
      }
    }
    if (!didAutoSelect) {
      updateStatusBar();
      updateTransformBox();
    }

    // reset import picks for next time
    importState.selectedPath = null;
    importState.pcFile = null;
    const pcNameEl = $('#import-pc-name');
    if (pcNameEl) pcNameEl.textContent = '';
    closeImportModal();

    const extra = summary && summary.frames ? ` · ${summary.frames} frames` : '';
    toast(`OK · ${summary ? summary.action : 'import'}${extra} · FCM ${summary && summary.fcm ? '✓' : '✗'}`, 'ok');
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    importState.busy = false;
    $('#import-apply').textContent = 'Subir y aplicar';
    updateImportApplyBtn();
  }
}

// ═════════════════════════════════════════════════════════════════════
// DEVICE SURFACE (adb → editor viewport)
// ═════════════════════════════════════════════════════════════════════

function formatDeviceLabel(dev) {
  if (!dev) return '1080×2340 ref';
  const dims = `${dev.width}×${dev.height}`;
  if (dev.connected && dev.source === 'device') {
    const name = dev.model || dev.serial || 'device';
    return `${name} · ${dims}`;
  }
  return `${dims} ref`;
}

function updateDeviceLabel() {
  const el = $('#device-label');
  if (!el) return;
  el.textContent = formatDeviceLabel(state.device);
  el.style.color = (state.device?.connected && state.device?.source === 'device')
    ? 'var(--cyan)' : 'var(--dim)';
  el.title = state.device?.message || 'Dimensiones del lienzo del editor';
}

async function applyDeviceSurface(dev, opts = {}) {
  // v1.7.45 CRITICAL FIX:
  // The editor canvas is ALWAYS authored against the TARGET reference
  // 1080×2340 regardless of the connected device. Previously, when a
  // device with different resolution connected, SC.setSurfaceDims() was
  // called with the device dims → all px-based coordinates (offset_x_px,
  // bob_amplitude_px, motion amplitudes) were saved in the device's
  // resolution and rendered desfasados on other devices.
  //
  // Now: SC.surface.w/h stays locked to 1080×2340. We only remember
  // the device info to show its label/dimensions in the toolbar (so
  // you know what's connected, but it doesn't affect the spec values).
  // The renderer scales TARGET-relative px values to each device's
  // actual surface at draw time (see pxScaleX/pxScaleY in
  // CanvasSceneRenderer.kt).
  const silent = !!opts.silent;
  state.device = dev;
  updateDeviceLabel();
  if (!silent) {
    const src = dev.source === 'device'
      ? `dispositivo ${dev.width}×${dev.height} detectado`
      : 'sin device — usando referencia';
    toast(`Canvas fijo 1080×2340 (${src})`, 'ok');
  }
  return true;
}

async function fetchDeviceSurface(opts = {}) {
  try {
    const r = await fetch('/api/device-surface');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const dev = await r.json();
    return applyDeviceSurface(dev, opts);
  } catch (e) {
    console.warn('device-surface failed', e);
    if (!opts.silent) toast('Sin adb — usando 1080×2340', 'error');
    updateDeviceLabel();
    return false;
  }
}

function startDevicePolling() {
  if (state.devicePollId) clearInterval(state.devicePollId);
  state.devicePollId = setInterval(() => fetchDeviceSurface({ silent: true }), 45000);
}

// ═════════════════════════════════════════════════════════════════════
// INIT
// ═════════════════════════════════════════════════════════════════════

$('#tool-sync').classList.add('active');
$('#tool-blink').classList.add('active');
$('#btn-device').onclick = () => fetchDeviceSurface();
$('#device-label').onclick = () => fetchDeviceSurface();
$('#tool-import').onclick = () => openImportModal();
$('#import-close').onclick = () => closeImportModal();
$('#import-overlay').onclick = (e) => { if (e.target === $('#import-overlay')) closeImportModal(); };
$('#import-refresh').onclick = () => { importState.images = []; loadDeviceImages(); };
$$('[data-import-tab]').forEach(t => t.onclick = () => setImportTab(t.dataset.importTab));
$$('[data-import-mode]').forEach(t => t.onclick = () => setImportMode(t.dataset.importMode));
$('#import-action').onchange = syncImportActionUi;
$('#import-layer-key').oninput = updateImportApplyBtn;
$('#import-sprite-name').oninput = updateImportApplyBtn;
$('#import-frame-skip').oninput = updateImportApplyBtn;
$('#import-apply').onclick = () => applySceneImport();
$('#import-pc-pick').onclick = () => $('#import-pc-file').click();
$('#import-pc-file').onchange = (e) => {
  const f = e.target.files?.[0];
  importState.pcFile = f || null;
  $('#import-pc-name').textContent = f ? `${f.name} · ${formatBytes(f.size)}` : '';
  updateImportApplyBtn();
};
fitCanvas();
fetchDeviceSurface({ silent: true }).then(() => startDevicePolling());
loadCatalog();

</script>
