<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Studio · Publicación en vivo</title>
<style>
:root{color-scheme:dark;--cyan:#31d9f5;--pink:#ff38aa;--gold:#ffd94a;--ink:#08051a;--panel:#110b2b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,sans-serif;color:#f5f1ff;background:radial-gradient(circle at 15% 10%,#17365c 0,transparent 32%),radial-gradient(circle at 85% 20%,#49134d 0,transparent 34%),var(--ink);display:grid;place-items:center;padding:28px}.shell{width:min(980px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-weight:900;letter-spacing:.22em;font-size:22px}.brand i{color:var(--cyan);font-style:normal}.live{border:1px solid #3ef0a8;color:#3ef0a8;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:800;letter-spacing:.13em}.card{background:linear-gradient(145deg,rgba(23,14,55,.96),rgba(8,7,29,.96));border:1px solid #513b83;border-radius:24px;padding:28px;box-shadow:0 25px 80px #0009}.top{display:flex;justify-content:space-between;gap:18px;align-items:end}.eyebrow{color:#a899cc;text-transform:uppercase;font-size:12px;letter-spacing:.17em;font-weight:800}h1{margin:7px 0 0;font-size:clamp(28px,5vw,48px)}.percent{font-size:clamp(42px,8vw,76px);font-weight:950;color:var(--gold);line-height:.9}.track{height:22px;border-radius:999px;background:#080716;border:1px solid #39285e;margin:28px 0 18px;overflow:hidden;padding:3px}.bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));box-shadow:0 0 24px #ff38aa99;transition:width .55s ease}.current{display:flex;justify-content:space-between;gap:20px;padding:16px 18px;border-radius:15px;background:#09071d;border:1px solid #2d2251}.current b{color:var(--cyan);overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.stat{padding:18px;border-radius:16px;background:#0b0822;border:1px solid #302255}.stat strong{display:block;font-size:30px;margin-top:7px}.stat:nth-child(1) strong{color:#65e6ff}.stat:nth-child(2) strong{color:#ff71c3}.stat:nth-child(3) strong{color:#ffd967}.recent{margin-top:20px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#cbbfed;padding:7px 9px;border:1px solid #3a2c63;border-radius:8px;background:#0a071d}.foot{display:flex;justify-content:space-between;color:#877ca6;font-size:12px;margin-top:20px}.error{display:none;margin-top:16px;padding:14px;border:1px solid #ff5370;color:#ff9aac;background:#40122666;border-radius:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:start}.current,.foot{flex-direction:column}}
</style>
</head>
<body><main class="shell"><header><div class="brand"><i>PIXEL·</i>STUDIO</div><div class="live" id="live">● EN VIVO</div></header><section class="card"><div class="top"><div><div class="eyebrow">Publicación a producción</div><h1>Pack aprobado</h1></div><div class="percent" id="percent">0%</div></div><div class="track"><div class="bar" id="bar"></div></div><div class="current"><span>Procesando ahora</span><b id="current">Preparando…</b></div><div class="grid"><div class="stat"><span>Static</span><strong id="static">0/51</strong></div><div class="stat"><span>Panoramic</span><strong id="pano">0/23</strong></div><div class="stat"><span>Parallax</span><strong id="canvas">0/23</strong></div></div><div class="recent"><div class="eyebrow" style="margin-bottom:10px">Últimas completadas</div><div class="chips" id="chips"><span class="chip">Esperando primera escena…</span></div></div><div class="error" id="error"></div><div class="foot"><span id="count">0 de 97 escenas</span><span id="updated">Actualizando…</span></div></section></main>
<script>
const $=id=>document.getElementById(id);async function refresh(){try{const r=await fetch('batch_publish_progress.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();const p=Number(d.percent||0);$('percent').textContent=p.toFixed(p%1?1:0)+'%';$('bar').style.width=p+'%';$('current').textContent=(d.current_type?d.current_type.toUpperCase()+' · ':'')+(d.current||'Preparando…');const c=d.completed_by_type||{};$('static').textContent=(c.static||0)+'/51';$('pano').textContent=(c.panoramic||0)+'/23';$('canvas').textContent=(c.canvas_scene||0)+'/23';$('count').textContent=(d.completed||0)+' de '+(d.total||97)+' escenas';$('updated').textContent='Actualizado '+new Date(d.updated_at).toLocaleTimeString();$('chips').innerHTML=(d.published_ids||[]).map(x=>'<span class="chip">'+x+'</span>').join('')||'<span class="chip">Esperando primera escena…</span>';$('live').textContent=d.status==='complete'?'✓ TERMINADO':d.status==='error'?'! ATENCIÓN':'● EN VIVO';$('error').style.display=d.error?'block':'none';$('error').textContent=d.error||''}catch(e){$('updated').textContent='Reconectando…'}}refresh();setInterval(refresh,1500);
</script></body></html>
