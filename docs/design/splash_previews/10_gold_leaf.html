<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>10 · Gold Leaf Abstract</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;font-family:'Inter',sans-serif}
.tag{position:fixed;top:16px;left:24px;color:#c9a650;font-size:12px;letter-spacing:0.3em;text-transform:uppercase;font-family:'Cormorant Garamond',serif;font-weight:500}.tag::before{content:"10 · ";color:#888}
.phone{width:320px;height:680px;background:#0a0604;border-radius:32px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.leaf{position:absolute;opacity:0.5;mix-blend-mode:screen}
.leaf.l1{top:-60px;left:-80px;width:300px;height:300px;background:radial-gradient(ellipse,#c9a650 20%,transparent 65%);filter:blur(40px)}
.leaf.l2{bottom:-80px;right:-100px;width:350px;height:350px;background:radial-gradient(ellipse,#8a6f33 20%,transparent 65%);filter:blur(50px)}
.leaf.l3{top:40%;right:-60px;width:200px;height:200px;background:radial-gradient(ellipse,#f0dd9e 15%,transparent 70%);filter:blur(30px);opacity:0.3}
.strokes{position:absolute;inset:0;overflow:hidden}
.stroke{position:absolute;background:linear-gradient(45deg,transparent,#c9a650,transparent);opacity:0.12;transform-origin:center}
.stroke.st1{top:15%;left:-20%;width:140%;height:2px;transform:rotate(-12deg)}
.stroke.st2{top:55%;left:-20%;width:140%;height:3px;transform:rotate(8deg);opacity:0.08}
.stroke.st3{bottom:20%;left:-20%;width:140%;height:1px;transform:rotate(-5deg)}
.center-block{position:relative;z-index:3;text-align:center;padding:40px 30px;background:rgba(10,6,4,0.6);backdrop-filter:blur(4px);border:1px solid rgba(201,166,80,0.25)}
.crown{color:#c9a650;font-size:20px;letter-spacing:0.5em;margin-bottom:16px}
.p{font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;font-size:140px;background:linear-gradient(135deg,#f0dd9e 10%,#c9a650 40%,#f0dd9e 60%,#8a6f33 90%);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.title{margin-top:8px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:30px;color:#f0e8d6;letter-spacing:0.35em}
.title .it{font-style:italic;font-weight:300;color:#c9a650;margin-left:6px}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0}
.divider::before,.divider::after{content:"";width:40px;height:1px;background:linear-gradient(90deg,transparent,#c9a650,transparent)}
.divider-diamond{color:#c9a650;font-size:9px}
.tagline{font-family:'Inter',sans-serif;font-weight:300;font-size:12px;color:rgba(240,232,214,0.65);letter-spacing:0.3em;text-transform:uppercase}
.bot{position:absolute;bottom:40px;left:0;right:0;text-align:center;z-index:3;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;color:#8a7a56;letter-spacing:0.3em}
</style></head><body>
<div class="tag">Gold Leaf Abstract</div>
<div class="phone">
  <div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div>
  <div class="strokes"><div class="stroke st1"></div><div class="stroke st2"></div><div class="stroke st3"></div></div>
  <div class="center-block">
    <div class="crown">✦ ✦ ✦</div>
    <div class="p">P</div>
    <div class="title">PIX<span class="it">ora</span></div>
    <div class="divider"><span class="divider-diamond">◆</span></div>
    <div class="tagline">gilded · collection</div>
  </div>
  <div class="bot">— an Orbix imprint · 2026 —</div>
</div>
</body></html>
