<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>07 · Royal Crest</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;font-family:'Cinzel',serif}
.tag{position:fixed;top:16px;left:24px;color:#c9a650;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;font-weight:700}.tag::before{content:"07 · ";color:#888}
.phone{width:320px;height:680px;background:radial-gradient(ellipse at top,#1a1208,#000 70%);border-radius:24px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.phone::before{content:"";position:absolute;inset:14px;border:1px solid rgba(201,166,80,0.3);border-radius:14px}
.scroll-top{position:absolute;top:50px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:#c9a650;letter-spacing:0.3em;text-transform:uppercase}
.shield{width:180px;height:220px;position:relative;margin:10px 0 16px}
.shield-bg{position:absolute;inset:0;background:linear-gradient(180deg,#1a1208,#0a0604);border:2px solid #c9a650;clip-path:polygon(0 0,100% 0,100% 65%,50% 100%,0 65%);box-shadow:0 0 30px rgba(201,166,80,0.3)}
.shield-inner{position:absolute;inset:12px;border:1px solid rgba(201,166,80,0.4);clip-path:polygon(0 0,100% 0,100% 65%,50% 100%,0 65%)}
.banner{position:absolute;top:30px;left:-10px;right:-10px;text-align:center;background:#0a0604;border:1px solid #c9a650;padding:4px 0;font-family:'Cinzel',serif;font-weight:700;font-size:9px;color:#c9a650;letter-spacing:0.3em}
.p{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);font-family:'Cinzel',serif;font-weight:900;font-size:90px;background:linear-gradient(180deg,#f0dd9e,#c9a650 50%,#8a6f33);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.crown{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:30px;color:#c9a650}
.ribbon{position:relative;background:linear-gradient(180deg,#8a6f33,#c9a650,#8a6f33);padding:6px 30px;margin-top:-4px;clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%);font-family:'Cinzel',serif;font-weight:700;font-size:11px;color:#0a0604;letter-spacing:0.25em}
.title-area{text-align:center;margin-top:30px}
.title{font-family:'Cinzel',serif;font-weight:900;font-size:34px;color:#f0e8d6;letter-spacing:0.15em;line-height:1}
.motto{margin-top:12px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:#c9a650;letter-spacing:0.1em}
.laurel{display:flex;justify-content:center;gap:6px;margin-top:8px;color:#c9a650;font-size:14px}
.scroll-bot{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-family:'Cinzel',serif;font-weight:400;font-size:9px;color:#8a7a56;letter-spacing:0.5em;text-transform:uppercase}
.year{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;color:#5a4e36;letter-spacing:0.3em}
</style></head><body>
<div class="tag">Royal Crest</div>
<div class="phone">
  <div class="scroll-top">— la casa de —</div>
  <div class="shield">
    <div class="crown">♛</div>
    <div class="shield-bg"><div class="shield-inner"></div></div>
    <div class="banner">◆ ORBIX ◆</div>
    <div class="p">P</div>
  </div>
  <div class="ribbon">PIXORA · ROYALE</div>
  <div class="title-area">
    <div class="title">PIXORA</div>
    <div class="motto">"ars · longa · vita · brevis"</div>
    <div class="laurel">☘ ☘ ☘</div>
  </div>
  <div class="scroll-bot">fundada MMXXVI · mexico</div>
  <div class="year">— orbix studio · royale —</div>
</div>
</body></html>
