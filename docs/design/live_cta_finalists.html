<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pixora · Live CTA Finalists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:        #0B0807;
    --bg-grain:       #100B09;
    --surface:        #1A1410;
    --surface-2:      #221A14;
    --gold:           #C9A650;
    --gold-soft:      #8A6F33;
    --gold-pale:      #F0DD9E;
    --gold-glow:      rgba(201,166,80,.45);
    --gold-glow-soft: rgba(201,166,80,.16);
    --text:           #F4ECD9;
    --text-dim:       #A89880;
    --divider:        rgba(201,166,80,.18);
    --shadow-deep:    0 24px 80px rgba(0,0,0,.6);
    --serif:          "Cormorant Garamond", "Apple Garamond", Georgia, serif;
    --sans:           "Manrope", system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 20% 0%, rgba(201,166,80,.10) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(201,166,80,.08) 0%, transparent 50%),
      var(--bg-deep);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grain overlay */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8 0 0 0 0 .65 0 0 0 0 .3 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    pointer-events: none;
    z-index: 999;
    mix-blend-mode: overlay;
    opacity: .35;
  }

  /* ======== HEADER ======== */
  header {
    padding: 56px 32px 24px;
    text-align: center;
    position: relative;
  }
  .eyebrow {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: .85;
  }
  h1 {
    margin: 8px 0 12px;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(34px, 5vw, 54px);
    line-height: 1.1;
    letter-spacing: -.01em;
    color: var(--text);
  }
  h1 .accent { color: var(--gold); font-weight: 600; }
  .lead {
    max-width: 640px;
    margin: 0 auto;
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.55;
  }
  .ornament {
    margin: 24px auto 0;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    position: relative;
  }
  .ornament::before {
    content: "✦";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -55%);
    background: var(--bg-deep);
    padding: 0 10px;
    color: var(--gold);
    font-size: 14px;
  }

  /* ======== GRID ======== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 28px;
    padding: 40px max(24px, 4vw) 80px;
    max-width: 1700px;
    margin: 0 auto;
  }

  /* ======== PHONE CARD ======== */
  .phone-card {
    position: relative;
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .phone-card:hover { transform: translateY(-6px); }

  .card-label {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 14px;
    padding: 0 4px;
  }
  .card-num {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    color: var(--gold);
    font-size: 28px;
    line-height: 1;
    letter-spacing: -.02em;
  }
  .card-title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 19px;
    color: var(--text);
    letter-spacing: .005em;
  }
  .card-tag {
    margin-left: auto;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-dim);
    border: 1px solid var(--divider);
    padding: 4px 8px;
    border-radius: 2px;
  }
  .card-desc {
    padding: 0 4px;
    margin: 0 0 14px;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.5;
    font-family: var(--serif);
    font-style: italic;
  }

  /* phone-mockup container */
  .phone {
    position: relative;
    background: linear-gradient(180deg, #2a1f17 0%, #1a1410 6%, #110d0a 100%);
    border-radius: 36px;
    padding: 10px 10px 0;
    box-shadow:
      inset 0 0 0 1px rgba(201,166,80,.12),
      0 30px 80px -20px rgba(0,0,0,.7),
      0 12px 30px -10px rgba(0,0,0,.5);
    overflow: hidden;
    aspect-ratio: 9/15.5;
  }

  /* faux wallpaper behind sheet */
  .wallpaper {
    position: absolute;
    inset: 10px 10px 0;
    border-radius: 30px;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 30% 20%, #4a2d1c 0%, #1a0e08 60%, #0b0604 100%),
      #0b0604;
  }
  .wallpaper::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,.5) 70%, rgba(0,0,0,.85) 100%);
  }
  .wp-art {
    position: absolute;
    inset: 0;
    opacity: .9;
  }
  /* abstract wallpaper svg layered for visual interest */
  .wp-art svg { width: 100%; height: 100%; display: block; }

  /* status bar */
  .status-bar {
    position: absolute;
    top: 18px; left: 28px; right: 28px;
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,.7);
    font-size: 10px;
    letter-spacing: .05em;
    font-weight: 600;
    z-index: 4;
  }

  /* BOTTOM SHEET (Pixora actual style) */
  .sheet {
    position: absolute;
    left: 10px; right: 10px; bottom: 10px;
    background: var(--surface);
    border-radius: 4px 4px 30px 30px;
    padding: 18px 22px 22px;
    box-shadow: var(--shadow-deep);
    z-index: 5;
    border-top: 1px solid rgba(201,166,80,.08);
  }

  .sheet-header {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }
  .sheet-eyebrow {
    font-family: var(--serif);
    font-style: italic;
    color: var(--gold);
    font-size: 14px;
    letter-spacing: .01em;
  }
  .sheet-eyebrow .em { font-weight: 500; padding-left: 4px; }
  .sheet-chip {
    margin-left: auto;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 9px;
    letter-spacing: .2em;
    padding: 4px 8px;
  }

  .credits {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 16px;
    letter-spacing: .04em;
  }
  .credits .dot { color: var(--gold-soft); }
  .credits .diamond { color: var(--gold); }

  .opt {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 4px;
    color: var(--text);
    transition: background .2s ease;
    cursor: pointer;
  }
  .opt:hover { background: rgba(201,166,80,.04); }
  .opt-icon {
    width: 22px; height: 22px;
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
  }
  .opt-text { flex: 1; min-width: 0; }
  .opt-label {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
    letter-spacing: -.005em;
  }
  .opt-sub {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
  }
  .opt-sub::before { content: "— "; opacity: .6; }
  .opt-chev {
    color: var(--gold);
    font-size: 14px;
    opacity: .7;
  }

  .divider {
    height: 1px;
    background: var(--divider);
    margin: 8px 0;
  }

  /* ============================================ */
  /* LIVE CTA — Variant 1: HALO PULSANTE          */
  /* ============================================ */
  .live-v1 {
    position: relative;
    padding: 14px 4px;
  }
  .live-v1::before {
    content: "";
    position: absolute;
    left: -4px; top: 50%;
    width: 44px; height: 44px;
    transform: translateY(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold-glow) 0%, transparent 65%);
    animation: halo-pulse 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes halo-pulse {
    0%, 100% { transform: translateY(-50%) scale(.85); opacity: .55; }
    50%      { transform: translateY(-50%) scale(1.25); opacity: 1; }
  }
  .live-v1 .opt-icon {
    color: var(--gold);
    filter: drop-shadow(0 0 6px var(--gold-glow));
    z-index: 1;
  }

  /* ============================================ */
  /* LIVE CTA — Variant 2: FOIL HOLOGRÁFICO       */
  /* ============================================ */
  .live-v2 {
    position: relative;
    padding: 14px 8px;
    border-radius: 6px;
    overflow: hidden;
    background:
      linear-gradient(90deg, rgba(201,166,80,.06), rgba(201,166,80,.10), rgba(201,166,80,.06));
    border: 1px solid rgba(201,166,80,.22);
  }
  .live-v2::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      105deg,
      transparent 30%,
      rgba(255,235,170,.45) 45%,
      rgba(120,220,255,.35) 50%,
      rgba(255,150,230,.40) 55%,
      transparent 70%
    );
    mix-blend-mode: screen;
    transform: translateX(-100%);
    animation: foil-sweep 3.4s cubic-bezier(.4,.05,.4,1) infinite;
    pointer-events: none;
  }
  @keyframes foil-sweep {
    0%      { transform: translateX(-100%); }
    100%    { transform: translateX(200%); }
  }
  .live-v2 .opt-icon { color: var(--gold-pale); }
  .live-v2 .opt-label { color: var(--gold-pale); }

  /* ============================================ */
  /* LIVE CTA — Variant 3: TARJETA + BADGE        */
  /* ============================================ */
  .live-v3 {
    position: relative;
    padding: 16px 12px;
    border-radius: 2px;
    background: linear-gradient(180deg, rgba(201,166,80,.05), rgba(201,166,80,.02));
    outline: 1px solid var(--gold);
    outline-offset: -1px;
    box-shadow:
      inset 0 0 0 3px var(--surface),
      inset 0 0 0 4px var(--gold-soft);
    margin-top: 4px;
  }
  .live-v3 .badge {
    position: absolute;
    top: -10px;
    right: 10px;
    background: linear-gradient(180deg, var(--gold-pale), var(--gold));
    color: #2a1c08;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 9px;
    letter-spacing: .22em;
    padding: 4px 9px;
    border-radius: 2px;
    box-shadow: 0 4px 14px rgba(201,166,80,.4);
  }
  .live-v3 .badge::before { content: "★ "; opacity: .7; }
  .live-v3 .opt-icon {
    width: 28px; height: 28px;
    color: var(--gold-pale);
    filter: drop-shadow(0 0 4px var(--gold-glow));
  }
  .live-v3 .opt-label { font-size: 14px; }

  /* ============================================ */
  /* LIVE CTA — Variant 4: PARTÍCULAS + GLOW      */
  /* ============================================ */
  .live-v4 {
    position: relative;
    padding: 14px 4px;
    overflow: visible;
  }
  .live-v4 .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }
  .particle {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--gold-pale);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--gold-glow);
    opacity: 0;
    animation: particle-drift 4s linear infinite;
  }
  .particle:nth-child(1) { left: 12px; top: 50%; animation-delay: 0s; }
  .particle:nth-child(2) { left: 26px; top: 30%; animation-delay: .6s; }
  .particle:nth-child(3) { left: 38px; top: 70%; animation-delay: 1.2s; }
  .particle:nth-child(4) { left: 20px; top: 20%; animation-delay: 1.8s; }
  .particle:nth-child(5) { left: 32px; top: 80%; animation-delay: 2.4s; width: 2px; height: 2px; }
  .particle:nth-child(6) { left: 16px; top: 65%; animation-delay: 3s; }
  .particle:nth-child(7) { left: 44px; top: 45%; animation-delay: 3.6s; width: 2px; height: 2px; }
  @keyframes particle-drift {
    0%   { opacity: 0; transform: translate(0, 0) scale(.4); }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(20px, -16px) scale(1.2); }
  }
  .live-v4 .opt-icon {
    color: var(--gold-pale);
    filter:
      drop-shadow(0 0 8px var(--gold-glow))
      drop-shadow(0 0 18px var(--gold-glow-soft));
    animation: icon-breathe 2.6s ease-in-out infinite;
  }
  @keyframes icon-breathe {
    0%, 100% { filter: drop-shadow(0 0 6px var(--gold-glow-soft)) drop-shadow(0 0 14px var(--gold-glow-soft)); }
    50%      { filter: drop-shadow(0 0 12px var(--gold-glow)) drop-shadow(0 0 24px var(--gold-glow)); }
  }

  /* ============================================ */
  /* LIVE CTA — Variant 5: FONDO + ARROW          */
  /* ============================================ */
  .live-v5 {
    position: relative;
    padding: 14px 12px;
    border-radius: 6px;
    background:
      linear-gradient(90deg,
        rgba(201,166,80,.14) 0%,
        rgba(201,166,80,.06) 100%);
    border-left: 2px solid var(--gold);
    margin-top: 4px;
  }
  .live-v5 .opt-icon { color: var(--gold-pale); }
  .live-v5 .opt-chev {
    animation: arrow-nudge 1.6s ease-in-out infinite;
    color: var(--gold);
    opacity: 1;
  }
  @keyframes arrow-nudge {
    0%, 100% { transform: translateX(0); opacity: .8; }
    50%      { transform: translateX(4px); opacity: 1; }
  }

  /* ============== PICK BUTTON ============== */
  .pick-btn {
    margin-top: 14px;
    display: block;
    width: 100%;
    background: transparent;
    border: 1px solid var(--divider);
    color: var(--text-dim);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    padding: 12px;
    cursor: pointer;
    transition: all .2s;
    border-radius: 2px;
  }
  .pick-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,166,80,.05);
  }
  .phone-card.selected .pick-btn {
    background: var(--gold);
    color: #1a1410;
    border-color: var(--gold);
  }
  .phone-card.selected .phone {
    box-shadow:
      inset 0 0 0 1px var(--gold),
      0 0 0 3px rgba(201,166,80,.25),
      0 30px 80px -20px rgba(0,0,0,.7);
  }
  .phone-card.selected .card-num,
  .phone-card.selected .card-title {
    color: var(--gold-pale);
  }

  /* footer */
  footer {
    text-align: center;
    padding: 24px 32px 56px;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: .15em;
    text-transform: uppercase;
    font-family: var(--sans);
  }
  footer .glyph { color: var(--gold); margin: 0 8px; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Pixora · Apply Picker</div>
  <h1>5 tratamientos para el <span class="accent">CTA Live</span></h1>
  <p class="lead">
    Cada bottom sheet replica el menú real de Pixora. La fila <em>Live wallpaper</em> tiene un tratamiento visual distinto. Escoge el que mejor combine con la identidad Sacred sin canibalizar las otras 3 opciones.
  </p>
  <div class="ornament"></div>
</header>

<main class="grid" id="grid"></main>

<footer>
  Pixora IA <span class="glyph">✦</span> Sacred Identity <span class="glyph">✦</span> v1.7.18
</footer>

<template id="sheet-tpl">
  <div class="phone-card" data-id="">
    <div class="card-label">
      <span class="card-num"></span>
      <span class="card-title"></span>
      <span class="card-tag"></span>
    </div>
    <p class="card-desc"></p>
    <div class="phone">
      <div class="wallpaper">
        <div class="wp-art">
          <svg viewBox="0 0 200 350" preserveAspectRatio="xMidYMid slice">
            <defs>
              <radialGradient id="g1" cx="40%" cy="20%">
                <stop offset="0%" stop-color="#8a5c2a" stop-opacity=".9"/>
                <stop offset="60%" stop-color="#3a1f0c" stop-opacity=".6"/>
                <stop offset="100%" stop-color="#0b0604" stop-opacity="0"/>
              </radialGradient>
              <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
                <circle cx="7" cy="7" r=".5" fill="#c9a650" opacity=".15"/>
              </pattern>
            </defs>
            <rect width="200" height="350" fill="url(#g1)"/>
            <rect width="200" height="350" fill="url(#dots)"/>
            <!-- floral ornament -->
            <g transform="translate(100,140)" stroke="#c9a650" stroke-opacity=".25" fill="none" stroke-width=".6">
              <circle r="40"/>
              <circle r="55"/>
              <path d="M-40,0 A40,40 0 0,1 40,0 M40,0 A40,40 0 0,1 -40,0"/>
              <path d="M0,-40 A40,40 0 0,1 0,40 M0,40 A40,40 0 0,1 0,-40"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="status-bar">
        <span>8:58</span>
        <span>● ⌃ ▲ 81%</span>
      </div>
      <div class="sheet">
        <div class="sheet-header">
          <span class="sheet-eyebrow">— <span class="em">aplicar pieza</span></span>
          <span class="sheet-chip">CON AD</span>
        </div>
        <div class="credits">
          <span class="diamond">◆</span>
          <span>420 diamantes</span>
          <span class="dot">·</span>
          <span>+15 por ver</span>
        </div>
        <!-- options inserted here -->
        <div class="opts"></div>
      </div>
    </div>
    <button class="pick-btn">Escoger este diseño</button>
  </div>
</template>

<script>
  // ==== Variants definition ====
  const VARIANTS = [
    {
      id: 1,
      title: "Halo pulsante",
      tag: "Sutil",
      desc: "Aura dorada respira 2.4s detrás del ícono. Premium sin ruido visual.",
      liveClass: "live-v1",
      liveExtra: ""
    },
    {
      id: 2,
      title: "Foil holográfico",
      tag: "Llamativo",
      desc: "Banda gradient hológrafo recorre la fila cada 3.4s. Carta rare holo.",
      liveClass: "live-v2",
      liveExtra: ""
    },
    {
      id: 3,
      title: "Tarjeta + badge",
      tag: "Estático",
      desc: "Borde dorado double-line + chip EXCLUSIVO. Museum piece, sin animar.",
      liveClass: "live-v3",
      liveExtra: '<span class="badge">EXCLUSIVO</span>'
    },
    {
      id: 4,
      title: "Partículas mágicas",
      tag: "Cuento",
      desc: "Polvo dorado flota alrededor + ícono respira. Vibe ensueño / fantasy.",
      liveClass: "live-v4",
      liveExtra: '<div class="particles"><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span></div>'
    },
    {
      id: 5,
      title: "Fondo tintado",
      tag: "CTA claro",
      desc: "Background gold 14→6% + arrow › se desliza L↔R cada 1.6s. Mínimo.",
      liveClass: "live-v5",
      liveExtra: ""
    },
  ];

  // ==== Icons (inline SVG, gold currentColor) ====
  const ICONS = {
    home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></svg>',
    lock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>',
    both: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="18" r=".8" fill="currentColor"/></svg>',
    spark: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>',
    chev: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>',
  };

  function opt(iconKey, label, sub, classExtra = "", extraHTML = "") {
    return `
      <div class="opt ${classExtra}">
        ${extraHTML}
        <div class="opt-icon">${ICONS[iconKey]}</div>
        <div class="opt-text">
          <div class="opt-label">${label}</div>
          <div class="opt-sub">${sub}</div>
        </div>
        <div class="opt-chev">${ICONS.chev}</div>
      </div>
    `;
  }

  const grid = document.getElementById('grid');
  const tpl = document.getElementById('sheet-tpl');

  VARIANTS.forEach(v => {
    const node = tpl.content.firstElementChild.cloneNode(true);
    node.dataset.id = v.id;
    node.querySelector('.card-num').textContent = String(v.id).padStart(2, '0');
    node.querySelector('.card-title').textContent = v.title;
    node.querySelector('.card-tag').textContent = v.tag;
    node.querySelector('.card-desc').textContent = v.desc;

    const opts = node.querySelector('.opts');
    opts.innerHTML =
      opt('home', 'Pantalla principal', 'home screen') +
      opt('lock', 'Pantalla de bloqueo', 'lock screen') +
      opt('both', 'Ambas pantallas', 'both') +
      `<div class="divider"></div>` +
      opt('spark', 'Live wallpaper (con efectos)', 'live + touch', v.liveClass, v.liveExtra);

    node.querySelector('.pick-btn').addEventListener('click', () => {
      document.querySelectorAll('.phone-card.selected').forEach(n => n.classList.remove('selected'));
      node.classList.add('selected');
      node.querySelector('.pick-btn').textContent = '✓ Escogido — copia el #' + v.id;
      setTimeout(() => {
        node.querySelector('.pick-btn').scrollIntoView({behavior:'smooth', block:'center'});
      }, 100);
    });

    grid.appendChild(node);
  });
</script>
</body>
</html>
