<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixora · Dial Curvo — Skin ANIME</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

:root{
  --ink:#1b1b2f;
  --pink:#ff2e88;
  --pink-soft:#ff9de0;
  --cyan:#26d0f5;
  --yellow:#ffe94d;
  --paper:#fff8ef;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:34px 16px;
  font-family:'Zen Maru Gothic',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 18%, rgba(38,208,245,.16), transparent 32%),
    radial-gradient(circle at 88% 82%, rgba(255,46,136,.14), transparent 34%),
    radial-gradient(rgba(27,27,47,.055) 1.4px, transparent 1.4px) 0 0/18px 18px,
    var(--paper);
  overflow-x:hidden;
}

/* manga speed-lines in the page corners */
body::before, body::after{
  content:'';
  position:fixed;
  width:420px;height:420px;
  pointer-events:none;
  z-index:0;
}
body::before{
  top:-140px;left:-140px;
  background:repeating-conic-gradient(from 25deg at 0 0, rgba(255,46,136,.16) 0 2deg, transparent 2deg 9deg);
}
body::after{
  bottom:-140px;right:-140px;
  background:repeating-conic-gradient(from 205deg at 100% 100%, rgba(38,208,245,.18) 0 2deg, transparent 2deg 9deg);
}

/* ---------- header ---------- */
.head{
  position:relative;z-index:1;
  text-align:center;
  max-width:420px;
}
.head .eyebrow{
  display:inline-block;
  font-weight:900;
  font-size:11px;
  letter-spacing:.22em;
  color:#fff;
  background:var(--ink);
  padding:5px 14px;
  border-radius:999px;
  transform:rotate(-1.5deg);
  box-shadow:3px 3px 0 var(--pink);
}
.head h1{
  font-family:'Mochiy Pop One',sans-serif;
  font-size:28px;
  margin:12px 0 6px;
  line-height:1.15;
  background:linear-gradient(100deg,var(--pink) 20%,#a53bff 55%,var(--cyan));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(2px 2px 0 rgba(27,27,47,.14));
}
.head h1 .spark{color:var(--yellow);-webkit-text-fill-color:var(--yellow);filter:drop-shadow(1px 1px 0 var(--ink));display:inline-block;animation:twinkle 1.6s ease-in-out infinite}
.head p{
  font-size:13.5px;
  font-weight:700;
  color:#5a5a74;
}
.head p b{color:var(--pink)}
@keyframes twinkle{
  0%,100%{transform:scale(1) rotate(0deg);opacity:1}
  50%{transform:scale(1.35) rotate(20deg);opacity:.7}
}

/* ---------- phone ---------- */
#phone{
  position:relative;z-index:1;
  width:340px;height:710px;
  padding:10px;
  border-radius:44px;
  background:linear-gradient(155deg,#ffffff,#ffe1f1 55%,#d6f6ff);
  border:4px solid var(--ink);
  box-shadow:
    8px 10px 0 rgba(27,27,47,.22),
    0 0 0 8px rgba(255,255,255,.55);
  animation:powerOn .55s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes powerOn{
  0%{transform:scale(.92) rotate(-2deg);opacity:0}
  100%{transform:scale(1) rotate(0);opacity:1}
}
/* notch */
#phone::before{
  content:'';
  position:absolute;
  top:20px;left:50%;
  width:110px;height:22px;
  transform:translateX(-50%);
  background:var(--ink);
  border-radius:999px;
  z-index:40;
  box-shadow:inset 0 0 0 3px #34345a;
}

#screen{
  position:relative;
  width:100%;height:100%;
  border-radius:34px;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  background:var(--ink);
}

/* ---------- wallpapers (live preview) ---------- */
.wall{position:absolute;inset:0;z-index:1}
.wall::after{ /* shared halftone + gloss, very anime cel feel */
  content:'';
  position:absolute;inset:0;
  background:
    linear-gradient(115deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 28%),
    radial-gradient(rgba(255,255,255,.16) 1.2px, transparent 1.2px) 0 0/14px 14px;
  pointer-events:none;
}
.wall.bgA{background:
  radial-gradient(circle at 76% 16%, #fff7b0 0 42px, rgba(255,247,176,0) 120px),
  radial-gradient(circle at 18% 78%, rgba(255,255,255,.55), transparent 40%),
  linear-gradient(168deg,#ffe3f2 0%,#ff9fce 48%,#ffb56b 100%);}
.wall.bgB{background:
  radial-gradient(circle at 28% 82%, rgba(255,255,255,.6), transparent 38%),
  radial-gradient(circle at 78% 22%, rgba(255,233,77,.5), transparent 30%),
  linear-gradient(205deg,#a8f6ff 0%,#3ec9ff 46%,#2b6cff 100%);}
.wall.bgC{background:
  radial-gradient(circle at 70% 74%, #ff88b8 0 34px, rgba(255,136,184,0) 110px),
  radial-gradient(circle at 24% 20%, rgba(255,255,255,.55), transparent 36%),
  linear-gradient(152deg,#ffc3d8 0%,#ff5f9e 52%,#c23bff 100%);}
.wall.bgD{background:
  radial-gradient(circle at 20% 24%, rgba(122,255,236,.55), transparent 36%),
  radial-gradient(circle at 82% 78%, rgba(255,157,224,.45), transparent 34%),
  linear-gradient(212deg,#7f7bff 0%,#4a3bd6 50%,#241a6b 100%);}
.wall.bgE{background:
  radial-gradient(circle at 50% 14%, #fff3a1 0 52px, rgba(255,243,161,0) 150px),
  radial-gradient(circle at 84% 70%, rgba(255,255,255,.4), transparent 30%),
  linear-gradient(180deg,#ffdf6b 0%,#ff9d3c 54%,#ff5e62 100%);}
.wall.bgF{background:
  radial-gradient(circle at 80% 28%, rgba(180,255,190,.5), transparent 34%),
  radial-gradient(circle at 22% 76%, rgba(255,233,77,.35), transparent 30%),
  linear-gradient(162deg,#7bffd0 0%,#20c997 46%,#0b7285 100%);}

/* floating sparkles over the wallpaper */
.sparkles{position:absolute;inset:0;z-index:2;pointer-events:none;font-size:18px;color:#fff}
.sparkles span{position:absolute;animation:twinkle 2.2s ease-in-out infinite;text-shadow:1px 1px 0 rgba(27,27,47,.3)}
.sparkles span:nth-child(1){top:14%;left:74%;animation-delay:.1s}
.sparkles span:nth-child(2){top:38%;left:14%;font-size:12px;animation-delay:.7s}
.sparkles span:nth-child(3){top:70%;left:80%;font-size:14px;animation-delay:1.3s}
.sparkles span:nth-child(4){top:84%;left:26%;font-size:11px;animation-delay:1.8s}

/* ---------- caption (manga panel chip) ---------- */
.caption{
  position:absolute;
  top:64px;left:18px;
  z-index:3;
  transform:rotate(-2deg);
  pointer-events:none;
}
#capName{
  display:inline-block;
  font-family:'Mochiy Pop One',sans-serif;
  font-size:26px;
  color:var(--ink);
  background:#fff;
  border:3px solid var(--ink);
  border-radius:14px 18px 16px 6px;
  padding:6px 16px 7px;
  box-shadow:4px 4px 0 var(--pink);
}
#capKick{
  display:inline-block;
  margin-top:8px;
  margin-left:10px;
  font-weight:900;
  font-size:12px;
  letter-spacing:.12em;
  color:#fff;
  background:var(--cyan);
  border:2.5px solid var(--ink);
  border-radius:999px;
  padding:3px 12px;
  box-shadow:2px 2px 0 rgba(27,27,47,.3);
}

/* ---------- FAB (side tab, aerodynamic) ---------- */
#fab{
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:60px;height:104px;
  border:3px solid var(--ink);
  border-left:none;
  border-radius:0 52px 52px 0;
  background:linear-gradient(160deg,var(--yellow) 0%,var(--pink) 55%,#a53bff 100%);
  color:#fff;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  box-shadow:4px 4px 0 rgba(27,27,47,.28), inset -3px 0 0 rgba(255,255,255,.45);
  transition:transform .35s cubic-bezier(.2,1.4,.4,1), opacity .25s;
  animation:fabNudge 2.6s ease-in-out infinite;
}
#fab .star{
  font-size:22px;
  line-height:1;
  filter:drop-shadow(1px 1px 0 var(--ink));
  animation:twinkle 1.8s ease-in-out infinite;
}
#fab .txt{
  font-family:'Mochiy Pop One',sans-serif;
  font-size:10px;
  letter-spacing:.14em;
  writing-mode:vertical-rl;
  text-orientation:upright;
  text-shadow:1px 1px 0 var(--ink);
}
@keyframes fabNudge{
  0%,100%{transform:translateY(-50%) translateX(0)}
  50%{transform:translateY(-50%) translateX(5px)}
}
#phone.open #fab{
  transform:translateY(-50%) translateX(-120%);
  opacity:0;
  pointer-events:none;
  animation:none;
}

/* ---------- scrim: manga concentration lines ---------- */
#scrim{
  position:absolute;inset:0;z-index:10;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
  background:
    repeating-conic-gradient(from 0deg at -70px 50%, rgba(255,46,136,.14) 0 1.6deg, rgba(255,46,136,0) 1.6deg 8deg),
    linear-gradient(100deg, rgba(255,255,255,.94) 0%, rgba(255,239,250,.82) 52%, rgba(214,246,255,.55) 100%);
}
#phone.open #scrim{opacity:1;pointer-events:auto}

/* ---------- dial ---------- */
#dialWrap{
  position:absolute;inset:0;z-index:11;
  opacity:0;
  pointer-events:none;
  transform:translateX(-26px);
  transition:opacity .28s ease, transform .38s cubic-bezier(.2,1.3,.4,1);
}
#phone.open #dialWrap{
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
}

/* the knob — candy machine grip, half off-screen */
.hub{
  position:absolute;
  left:-70px;
  top:calc(50% + 8px);
  transform:translate(-50%,-50%);
  width:264px;height:264px;
  border-radius:50%;
  background:repeating-conic-gradient(var(--pink) 0 5deg, #fff 5deg 12deg);
  border:6px solid var(--ink);
  box-shadow:0 0 0 6px #fff, 6px 0 22px rgba(255,46,136,.35);
  animation:hubSpin 26s linear infinite;
}
.hub::before{ /* inner disc */
  content:'';
  position:absolute;inset:34px;
  border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #fff 0 22%, #ffe1f1 60%, var(--pink-soft));
  border:4px solid var(--ink);
}
.hub::after{ /* center star */
  content:'✦';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-54%);
  font-size:52px;
  color:var(--pink);
  text-shadow:2px 2px 0 var(--ink);
}
@keyframes hubSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* the needle — energy bolt pointing at the active section */
.needle{
  position:absolute;
  left:96px;
  top:calc(50% + 8px);
  transform:translateY(-50%);
  width:62px;height:24px;
  z-index:12;
  background:linear-gradient(90deg,var(--yellow),var(--pink));
  clip-path:polygon(0 26%,62% 26%,62% 0,100% 50%,62% 100%,62% 74%,0 74%);
  filter:drop-shadow(2px 2px 0 rgba(27,27,47,.4));
  animation:needlePulse 1.1s ease-in-out infinite;
  pointer-events:none;
}
.needle::before{
  content:'';
  position:absolute;
  left:6px;top:50%;
  width:34px;height:4px;
  transform:translateY(-50%);
  background:rgba(255,255,255,.75);
  border-radius:2px;
}
@keyframes needlePulse{
  0%,100%{transform:translateY(-50%) translateX(0)}
  50%{transform:translateY(-50%) translateX(6px)}
}

#dial{position:absolute;inset:0}

/* ---------- options (engine injects + positions) ---------- */
.opt{
  position:absolute;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  white-space:nowrap;
  min-height:46px;
}
.opt.snap{
  transition:transform .4s cubic-bezier(.2,.9,.3,1), opacity .3s;
}
.opt .ic{
  width:46px;height:46px;
  flex:0 0 46px;
  border-radius:16px 16px 16px 5px;
  background:#fff;
  border:3px solid var(--ink);
  display:grid;
  place-items:center;
  box-shadow:3px 3px 0 rgba(27,27,47,.22);
  position:relative;
  transition:background .2s, box-shadow .2s, border-color .2s;
}
.opt .ic svg{
  width:23px;height:23px;
  fill:none;
  stroke:var(--ink);
  stroke-width:2.1;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:stroke .2s;
}
.opt .lb{
  display:flex;
  flex-direction:column;
  font-family:'Mochiy Pop One',sans-serif;
  font-size:15.5px;
  color:var(--ink);
  text-shadow:
    -1.5px 0 #fff, 1.5px 0 #fff, 0 -1.5px #fff, 0 1.5px #fff,
    2px 2px 0 rgba(255,255,255,.9);
  transition:color .2s;
}
.opt .lb small{
  font-family:'Zen Maru Gothic',sans-serif;
  font-weight:900;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#8a7f9e;
  margin-top:1px;
}

/* active = falls on the needle: full henshin glow */
.opt.active .ic{
  background:linear-gradient(150deg,var(--yellow) 10%,var(--pink-soft) 90%);
  border-color:var(--pink);
  box-shadow:
    0 0 0 3px #fff,
    0 0 0 6px rgba(255,46,136,.35),
    0 0 22px rgba(255,46,136,.55),
    3px 3px 0 rgba(27,27,47,.25);
}
.opt.active .ic svg{stroke:var(--ink)}
.opt.active .ic::after{
  content:'✦';
  position:absolute;
  top:-13px;right:-11px;
  font-size:16px;
  color:var(--yellow);
  text-shadow:1px 1px 0 var(--ink);
  animation:twinkle 1s ease-in-out infinite;
}
.opt.active .lb{color:var(--pink)}
.opt.active .lb small{color:#c04f8f}

/* ---------- apply ---------- */
#apply{
  position:absolute;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) rotate(-2deg);
  z-index:13;
  min-height:50px;
  padding:11px 34px 13px;
  font-family:'Mochiy Pop One',sans-serif;
  font-size:17px;
  color:#fff;
  text-shadow:1.5px 1.5px 0 rgba(27,27,47,.55);
  background:linear-gradient(135deg,var(--pink) 20%,#a53bff);
  border:3.5px solid var(--ink);
  border-radius:999px;
  box-shadow:4px 5px 0 var(--ink), 0 0 18px rgba(255,46,136,.4);
  cursor:pointer;
  transition:transform .15s cubic-bezier(.2,1.6,.4,1), box-shadow .15s;
}
#apply:active{
  transform:translateX(-50%) rotate(-2deg) translateY(3px);
  box-shadow:2px 2px 0 var(--ink);
}
#apply::before{content:'✦ ';color:var(--yellow)}
#apply::after{content:' ✦';color:var(--yellow)}
</style>
</head>
<body>

<div class="head">
  <span class="eyebrow">PIXORA · ESTILO ANIME</span>
  <h1><span class="spark">✦</span> Perilla Henshin <span class="spark">✦</span></h1>
  <p>Toca el <b>botón lateral</b> → arrastra la perilla <b>↑↓</b> → <b>Aplicar</b>. ¡Transformación de sección al instante!</p>
</div>

<div id="phone">
  <div id="screen">
    <div id="wall" class="wall bgA"></div>

    <div class="sparkles" aria-hidden="true">
      <span>✦</span><span>✧</span><span>✦</span><span>✧</span>
    </div>

    <div class="caption">
      <div id="capName">Estáticos</div><br>
      <div id="capKick">Fondos fijos</div>
    </div>

    <button id="fab" aria-label="Abrir selector de secciones">
      <span class="star">✦</span>
      <span class="txt">メニュー</span>
    </button>

    <div id="scrim"></div>

    <div id="dialWrap">
      <div class="hub" aria-hidden="true"></div>
      <div class="needle" aria-hidden="true"></div>
      <div id="dial"></div>
      <button id="apply">¡Aplicar!</button>
    </div>
  </div>
</div>

<script src="_dial_engine.js"></script>
</body>
</html>
