<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixora · CRT Terminal · HUD Finalists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Manrope:wght@200;300;500;700&family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg:       #050505;
    --card-border:   rgba(0,229,255,.10);
    --cyan:          #00E5FF;
    --cyan-dim:      rgba(0,229,255,.40);
    --cyan-glow:     rgba(0,229,255,.30);
    --text:          #f5f5f7;
    --text-dim:      #93939a;
    --text-mute:     #5f5f66;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 20% 0%, rgba(0,229,255,.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(0,180,200,.04) 0%, transparent 50%),
      var(--page-bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .85 0 0 0 0 1 0 0 0 .05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    pointer-events: none; z-index: 999; mix-blend-mode: overlay; opacity: .25;
  }

  header { padding: 56px 32px 12px; text-align: center; }
  .eyebrow {
    font-family: 'Major Mono Display', monospace;
    font-size: 12px; letter-spacing: .35em; color: var(--cyan);
    text-transform: lowercase; opacity: .9;
    text-shadow: 0 0 8px var(--cyan-glow);
  }
  h1 {
    margin: 14px 0 12px; font-weight: 200;
    font-size: clamp(34px, 5vw, 54px); line-height: 1.05; letter-spacing: -.025em;
  }
  h1 .accent {
    font-weight: 700; color: var(--cyan);
    text-shadow: 0 0 24px var(--cyan-glow);
  }
  .lead {
    max-width: 700px; margin: 0 auto; color: var(--text-dim);
    font-size: 14.5px; line-height: 1.55;
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 26px; padding: 30px max(20px, 3vw) 80px;
    max-width: 1700px; margin: 0 auto;
  }
  .card { position: relative; transition: transform .4s cubic-bezier(.2,.8,.2,1); }
  .card:hover { transform: translateY(-5px); }
  .card-head {
    display: flex; align-items: baseline; gap: 12px;
    padding: 0 6px; margin-bottom: 12px;
  }
  .card-num {
    font-family: 'Major Mono Display', monospace;
    color: var(--cyan); font-size: 22px; letter-spacing: -.04em;
    text-shadow: 0 0 10px var(--cyan-glow);
  }
  .card-title { font-weight: 700; font-size: 17px; color: var(--text); }
  .card-tag {
    margin-left: auto; font-family: 'Major Mono Display', monospace;
    font-size: 9px; letter-spacing: .22em; color: var(--text-mute);
    border: 1px solid var(--card-border); padding: 4px 8px; border-radius: 2px;
    text-transform: lowercase;
  }
  .card-desc {
    padding: 0 6px; margin: 0 0 14px;
    color: var(--text-dim); font-size: 12.5px; line-height: 1.5;
  }

  .phone {
    position: relative;
    background: radial-gradient(140% 90% at 50% -10%, #0a1a22 0%, #060c12 55%, #030608 100%);
    border-radius: 36px; padding: 10px 10px 0;
    box-shadow:
      inset 0 0 0 1px rgba(0,229,255,.08),
      0 25px 70px -20px rgba(0,0,0,.7);
    overflow: hidden; aspect-ratio: 9/16;
  }
  .wp {
    position: absolute; inset: 10px 10px 0;
    border-radius: 30px; overflow: hidden;
    background: radial-gradient(120% 80% at 30% 20%, #0a1a25 0%, #04080d 60%, #020406 100%);
  }
  /* CRT scanlines overlay (subtle) */
  .wp::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(0,229,255,.03) 0,
      rgba(0,229,255,.03) 1px,
      transparent 1px,
      transparent 3px);
    pointer-events: none;
  }
  .status-bar {
    position: absolute; top: 18px; left: 28px; right: 28px;
    display: flex; justify-content: space-between;
    color: rgba(0,229,255,.55); font-size: 10px;
    letter-spacing: .05em; font-weight: 500; z-index: 4;
    font-family: 'Major Mono Display', monospace;
  }
  /* CRT Terminal clock — cyan Orbitron with strong glow */
  .clock {
    position: absolute; top: 84px; left: 0; right: 0;
    text-align: center; color: var(--cyan);
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: 60px; letter-spacing: .04em; line-height: 1; z-index: 6;
    text-shadow:
      0 0 12px var(--cyan-glow),
      0 0 28px rgba(0,229,255,.25);
  }
  .date {
    position: absolute; top: 156px; left: 0; right: 0;
    text-align: center; color: rgba(0,229,255,.65);
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    letter-spacing: .35em; z-index: 6;
  }
  .dock {
    position: absolute; bottom: 22px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 22px; z-index: 6;
  }
  .dock-icon {
    width: 32px; height: 32px; border-radius: 9px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.08);
  }
  /* CRT EQ — cyan bars + sine wave (simulated static) */
  .eq-cyan {
    position: absolute; left: 22px; right: 22px; bottom: 86px;
    height: 80px; z-index: 5;
    display: flex; align-items: flex-end; gap: 2px;
    pointer-events: none;
  }
  .eq-cyan-bar {
    flex: 1; height: 50%; background: var(--cyan);
    opacity: 0.85;
    border-radius: 1px 1px 0 0;
    box-shadow: 0 0 4px var(--cyan-glow);
  }
  .eq-sine {
    position: absolute; left: 22px; right: 22px; bottom: 130px;
    height: 30px; z-index: 5;
    pointer-events: none;
  }
  .eq-sine svg { width: 100%; height: 100%; display: block; }
  .eq-sine path {
    fill: none; stroke: rgba(255,255,255,.55); stroke-width: 1;
  }

  /* HUD slot */
  .hud-slot { position: absolute; top: 56px; left: 0; right: 0; z-index: 7; }

  /* ─────────────────────────────────────────────────────────
   *  VARIANT 01 — HEX LEDS (3 hexagons top-center)
   * ───────────────────────────────────────────────────────── */
  .v1 .hud-slot {
    display: flex; justify-content: center; gap: 8px;
    padding: 0 24px;
  }
  .v1 .hex {
    position: relative;
    width: 48px; height: 56px;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: linear-gradient(180deg, rgba(0,229,255,.18), rgba(0,229,255,.05));
    border: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .v1 .hex::before {
    content: ""; position: absolute; inset: 1px;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: linear-gradient(180deg, #0a1a22, #050a0f);
  }
  .v1 .hex .val {
    position: relative; z-index: 2;
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 16px; color: var(--cyan);
    text-shadow: 0 0 6px var(--cyan-glow);
  }
  .v1 .hex .lbl {
    position: relative; z-index: 2;
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px; color: rgba(0,229,255,.6);
    letter-spacing: .18em; margin-top: 1px;
  }
  .v1 .hex.warn .val { color: #FFD23F; text-shadow: 0 0 6px rgba(255,210,63,.5); }
  .v1 .hex.crit .val { color: #FF5577; text-shadow: 0 0 6px rgba(255,85,119,.5); }

  /* ─────────────────────────────────────────────────────────
   *  VARIANT 02 — PILLAR STACK (3 vertical bars top-right)
   * ───────────────────────────────────────────────────────── */
  .v2 .hud-slot {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 8px 22px 0;
  }
  .v2 .pillar {
    width: 14px; height: 80px;
    position: relative;
    background: linear-gradient(180deg, #0a1a22 0%, #050a0f 100%);
    border: 1px solid var(--cyan-dim);
    border-radius: 2px;
    overflow: hidden;
  }
  .v2 .pillar .fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, var(--cyan), rgba(0,229,255,.4));
    box-shadow: inset 0 0 6px var(--cyan-glow);
  }
  .v2 .pillar .lbl {
    position: absolute; bottom: -16px; left: 0; right: 0;
    text-align: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px; color: rgba(0,229,255,.6);
    letter-spacing: .15em;
  }
  .v2 .pillar .val {
    position: absolute; top: -14px; left: 0; right: 0;
    text-align: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; color: var(--cyan);
    text-shadow: 0 0 4px var(--cyan-glow);
  }

  /* ─────────────────────────────────────────────────────────
   *  VARIANT 03 — TERMINAL OUTPUT (mono text block)
   * ───────────────────────────────────────────────────────── */
  .v3 .hud-slot {
    display: flex; justify-content: flex-end;
    padding: 4px 22px 0;
  }
  .v3 .terminal {
    background: rgba(0,20,28,.55);
    border: 1px solid var(--cyan-dim);
    border-radius: 2px;
    padding: 6px 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--cyan);
    text-shadow: 0 0 3px var(--cyan-glow);
    line-height: 1.5;
    letter-spacing: .05em;
  }
  .v3 .terminal .row { display: flex; gap: 6px; }
  .v3 .terminal .row .k { opacity: .65; width: 28px; }
  .v3 .terminal .row .b {
    font-family: monospace; letter-spacing: -.05em;
    color: var(--cyan);
  }
  .v3 .terminal .row .p { width: 32px; text-align: right; }

  /* ─────────────────────────────────────────────────────────
   *  VARIANT 04 — RADAR DIALS (3 circular gauges)
   * ───────────────────────────────────────────────────────── */
  .v4 .hud-slot {
    display: flex; justify-content: center; gap: 14px;
    padding: 0 24px;
  }
  .v4 .dial {
    width: 50px; height: 50px;
    position: relative;
    background: radial-gradient(circle, #04080d 60%, transparent 70%);
  }
  .v4 .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .v4 .dial .arc-bg { fill: none; stroke: rgba(0,229,255,.15); stroke-width: 3; }
  .v4 .dial .arc-fg {
    fill: none; stroke: var(--cyan); stroke-width: 3;
    stroke-linecap: round;
    filter: drop-shadow(0 0 4px var(--cyan-glow));
  }
  .v4 .dial .val {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 13px; color: var(--cyan);
    text-shadow: 0 0 4px var(--cyan-glow);
  }
  .v4 .dial .lbl {
    position: absolute; bottom: -14px; left: 0; right: 0;
    text-align: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px; color: rgba(0,229,255,.6);
    letter-spacing: .18em;
  }

  /* ─────────────────────────────────────────────────────────
   *  VARIANT 05 — BRACKET SCHEMATIC (technical bordered)
   * ───────────────────────────────────────────────────────── */
  .v5 .hud-slot {
    display: flex; flex-direction: column; gap: 5px;
    padding: 0 22px 0;
    align-items: flex-start;
  }
  .v5 .bracket {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; color: var(--cyan);
    position: relative;
  }
  .v5 .bracket::before, .v5 .bracket::after {
    content: ""; position: absolute;
    width: 6px; height: 6px;
    border: 1px solid var(--cyan);
  }
  .v5 .bracket::before {
    top: 0; left: 0;
    border-right: none; border-bottom: none;
  }
  .v5 .bracket::after {
    bottom: 0; right: 0;
    border-left: none; border-top: none;
  }
  .v5 .bracket .k { opacity: .7; letter-spacing: .1em; width: 28px; }
  .v5 .bracket .v {
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    color: var(--cyan); width: 40px; text-align: right;
    text-shadow: 0 0 4px var(--cyan-glow);
  }
  .v5 .bracket .meter {
    width: 36px; height: 3px;
    background: rgba(0,229,255,.15);
    position: relative;
  }
  .v5 .bracket .meter .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--cyan);
    box-shadow: 0 0 4px var(--cyan-glow);
  }

  .pick {
    margin-top: 14px; display: block; width: 100%;
    background: transparent; border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 11px;
    letter-spacing: .22em; text-transform: uppercase;
    padding: 12px; cursor: pointer; transition: all .2s; border-radius: 2px;
  }
  .pick:hover { border-color: var(--cyan); color: var(--cyan); }
  .card.picked .pick { background: var(--cyan); color: #0a0a0a; border-color: var(--cyan); }
  .card.picked .phone {
    box-shadow:
      inset 0 0 0 1px var(--cyan),
      0 0 0 3px rgba(0,229,255,.22),
      0 25px 70px -20px rgba(0,0,0,.7);
  }

  footer {
    text-align: center; padding: 12px 32px 60px;
    color: var(--text-mute); font-size: 11px; letter-spacing: .25em;
    text-transform: uppercase; font-family: 'Major Mono Display', monospace;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">// crt terminal · hud finalists</div>
  <h1>5 HUDs para <span class="accent">CRT Terminal</span></h1>
  <p class="lead">
    El clock + EQ ya son cyan Orbitron + sine-wave overlay. Cada variante explora un layout distinto para BAT/RAM/DSK manteniendo la identidad sci-fi cyan. Todos son baratos en memoria — solo formas + texto.
  </p>
</header>

<main class="grid" id="grid"></main>

<footer>Pixora · CRT Terminal · 2026-06-08</footer>

<template id="phone-tpl">
  <div class="card" data-id="">
    <div class="card-head">
      <span class="card-num"></span>
      <span class="card-title"></span>
      <span class="card-tag"></span>
    </div>
    <p class="card-desc"></p>
    <div class="phone">
      <div class="wp"></div>
      <div class="status-bar"><span>9:41 · PIXORA</span><span>● 84%</span></div>
      <div class="hud-slot"></div>
      <div class="clock">23:16</div>
      <div class="date">LUN 08 JUN · :48</div>
      <!-- CRT cyan bars (static demo) — sine wave overlay removed per user request -->

      <div class="eq-cyan">
        <div class="eq-cyan-bar" style="height:35%"></div>
        <div class="eq-cyan-bar" style="height:55%"></div>
        <div class="eq-cyan-bar" style="height:70%"></div>
        <div class="eq-cyan-bar" style="height:85%"></div>
        <div class="eq-cyan-bar" style="height:90%"></div>
        <div class="eq-cyan-bar" style="height:75%"></div>
        <div class="eq-cyan-bar" style="height:60%"></div>
        <div class="eq-cyan-bar" style="height:80%"></div>
        <div class="eq-cyan-bar" style="height:65%"></div>
        <div class="eq-cyan-bar" style="height:50%"></div>
        <div class="eq-cyan-bar" style="height:70%"></div>
        <div class="eq-cyan-bar" style="height:85%"></div>
        <div class="eq-cyan-bar" style="height:60%"></div>
        <div class="eq-cyan-bar" style="height:45%"></div>
        <div class="eq-cyan-bar" style="height:30%"></div>
      </div>
      <div class="dock">
        <div class="dock-icon"></div><div class="dock-icon"></div>
        <div class="dock-icon"></div><div class="dock-icon"></div>
      </div>
    </div>
    <button class="pick">Escoger este HUD</button>
  </div>
</template>

<script>
const VARIANTS = [
  {
    id: 1, num: '01', title: 'Hex Shields', tag: 'sci-fi',
    cls: 'v1',
    desc: 'Tres hexágonos cyan con clip-path, valor Orbitron al centro + label monospace abajo. Vibe sci-fi shields. Yellow warning si >75%, red crit si >90%.',
    html: `
      <div class="hex"><span class="val">84</span><span class="lbl">BAT</span></div>
      <div class="hex"><span class="val">54</span><span class="lbl">RAM</span></div>
      <div class="hex"><span class="val">71</span><span class="lbl">DSK</span></div>
    `,
  },
  {
    id: 2, num: '02', title: 'Pillar Stack', tag: 'capacitor',
    cls: 'v2',
    desc: 'Tres pilares verticales angostos top-right. Fill cyan se llena de abajo. Valor arriba, label abajo. Como capacitores cargándose.',
    html: `
      <div class="pillar"><span class="val">84</span><div class="fill" style="height:84%"></div><span class="lbl">BAT</span></div>
      <div class="pillar"><span class="val">54</span><div class="fill" style="height:54%"></div><span class="lbl">RAM</span></div>
      <div class="pillar"><span class="val">71</span><div class="fill" style="height:71%"></div><span class="lbl">DSK</span></div>
    `,
  },
  {
    id: 3, num: '03', title: 'Terminal Output', tag: 'shell stdout',
    cls: 'v3',
    desc: 'Bloque tipo terminal con ASCII bars: "BAT [█████░░] 84%". Mono Share Tech, glow cyan. Como output de un comando "$ stat".',
    html: `
      <div class="terminal">
        <div class="row"><span class="k">BAT</span><span class="b">[████████░░]</span><span class="p">84%</span></div>
        <div class="row"><span class="k">RAM</span><span class="b">[█████░░░░░]</span><span class="p">54%</span></div>
        <div class="row"><span class="k">DSK</span><span class="b">[███████░░░]</span><span class="p">71%</span></div>
      </div>
    `,
  },
  {
    id: 4, num: '04', title: 'Radar Dials', tag: 'instrument',
    cls: 'v4',
    desc: 'Tres diales circulares con arco cyan progresivo, valor Orbitron al centro, label abajo. Vibe radar/instrumento de avionica.',
    html: `
      <div class="dial">
        <svg viewBox="0 0 50 50">
          <circle class="arc-bg" cx="25" cy="25" r="20"/>
          <circle class="arc-fg" cx="25" cy="25" r="20" stroke-dasharray="125.6" stroke-dashoffset="20.1"/>
        </svg>
        <div class="val">84</div><div class="lbl">BAT</div>
      </div>
      <div class="dial">
        <svg viewBox="0 0 50 50">
          <circle class="arc-bg" cx="25" cy="25" r="20"/>
          <circle class="arc-fg" cx="25" cy="25" r="20" stroke-dasharray="125.6" stroke-dashoffset="57.8"/>
        </svg>
        <div class="val">54</div><div class="lbl">RAM</div>
      </div>
      <div class="dial">
        <svg viewBox="0 0 50 50">
          <circle class="arc-bg" cx="25" cy="25" r="20"/>
          <circle class="arc-fg" cx="25" cy="25" r="20" stroke-dasharray="125.6" stroke-dashoffset="36.4"/>
        </svg>
        <div class="val">71</div><div class="lbl">DSK</div>
      </div>
    `,
  },
  {
    id: 5, num: '05', title: 'Bracket Schematic', tag: 'blueprint',
    cls: 'v5',
    desc: 'Tres filas con corner brackets [ ] estilo blueprint tecnico. Label + meter mini + valor. Sci-fi engineering schematic feel.',
    html: `
      <div class="bracket"><span class="k">BAT</span><span class="meter"><span class="fill" style="width:84%"></span></span><span class="v">84%</span></div>
      <div class="bracket"><span class="k">RAM</span><span class="meter"><span class="fill" style="width:54%"></span></span><span class="v">54%</span></div>
      <div class="bracket"><span class="k">DSK</span><span class="meter"><span class="fill" style="width:71%"></span></span><span class="v">71%</span></div>
    `,
  },
];

const grid = document.getElementById('grid');
const tpl = document.getElementById('phone-tpl');

VARIANTS.forEach(v => {
  const node = tpl.content.firstElementChild.cloneNode(true);
  node.dataset.id = v.id;
  node.classList.add(v.cls);
  node.querySelector('.card-num').textContent = v.num;
  node.querySelector('.card-title').textContent = v.title;
  node.querySelector('.card-tag').textContent = v.tag;
  node.querySelector('.card-desc').textContent = v.desc;
  node.querySelector('.hud-slot').innerHTML = v.html;
  node.querySelector('.pick').addEventListener('click', () => {
    document.querySelectorAll('.card.picked').forEach(c => c.classList.remove('picked'));
    node.classList.add('picked');
    node.querySelector('.pick').textContent = '✓ Implementar HUD #' + v.num;
  });
  grid.appendChild(node);
});
</script>
</body>
</html>
