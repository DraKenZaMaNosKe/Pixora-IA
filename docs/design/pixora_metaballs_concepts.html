<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pixora REALM · 10 Metaball Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..900;1,9..144,200..900&family=JetBrains+Mono:wght@300..700&family=Inter:wght@300..900&family=Audiowide&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cyan:#00E5FF; --magenta:#FF00CC; --rose:#FF3478;
    --rose-bright:#FF8FBE; --violet:#9D4EDD; --violet-bright:#C77DFF;
    --gold:#FFD66B;
  }
  html,body{
    background:radial-gradient(ellipse at top,#06081A 0%,#02020A 60%,#000 100%);
    color:#eee;font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden;
  }
  .wrap{max-width:1700px;margin:0 auto;padding:48px 24px 120px}
  .head{text-align:center;margin-bottom:64px;position:relative}
  .head::before{
    content:'';position:absolute;top:-30px;left:50%;transform:translateX(-50%);
    width:380px;height:380px;border-radius:50%;
    background:radial-gradient(circle,rgba(157,78,221,.22),transparent 60%);
    z-index:-1;animation:pulseGlow 4s ease-in-out infinite;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.32em;
    color:var(--violet-bright);text-transform:uppercase;margin-bottom:18px;font-weight:600;
    opacity:0;animation:fade .8s .1s forwards;
  }
  h1{
    font-family:'Fraunces',serif;font-style:italic;font-weight:300;
    font-size:clamp(48px,8vw,84px);line-height:.95;letter-spacing:-.03em;
    color:#fff;margin-bottom:18px;opacity:0;animation:fade .9s .3s forwards;
  }
  h1 .accent{
    font-family:'Audiowide',cursive;font-style:normal;font-weight:400;
    background:linear-gradient(135deg,var(--violet-bright),var(--magenta) 50%,var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:.02em;
  }
  .sub{
    font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;
    color:rgba(255,255,255,.65);max-width:760px;margin:0 auto 32px;
    opacity:0;animation:fade .9s .5s forwards;
  }
  .sub b{
    background:linear-gradient(135deg,var(--violet-bright),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:500;
  }
  .grid{display:grid;grid-template-columns:1fr;gap:32px;max-width:1600px;margin:0 auto}
  @media (min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media (min-width:1500px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0));
    border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:20px;
    transition:all .35s;display:flex;flex-direction:column;gap:14px;
  }
  .card:hover{
    border-color:rgba(157,78,221,.4);transform:translateY(-3px);
    box-shadow:0 16px 50px rgba(157,78,221,.10),0 4px 12px rgba(0,0,0,.5);
  }
  .card-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .card-tag{
    font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:.3em;color:var(--violet-bright);text-transform:uppercase;font-weight:700;
  }
  .card-name{
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:20px;color:#fff;letter-spacing:-.005em;
  }
  .card-desc{
    font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.55;
    color:rgba(255,255,255,.55);
  }
  .card-desc b{color:var(--violet-bright);font-weight:500}
  .phone{
    position:relative;width:100%;aspect-ratio:9/19.5;background:#000;border-radius:28px;
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.6);
    overflow:hidden;cursor:crosshair;touch-action:none;
  }
  .phone canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .touch-note{
    display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;
    font-size:9.5px;color:rgba(199,125,255,.85);text-transform:uppercase;
    letter-spacing:.18em;padding-top:4px;border-top:1px solid rgba(255,255,255,.05);
  }
  .touch-note::before{
    content:'';width:6px;height:6px;border-radius:50%;background:var(--violet-bright);
    box-shadow:0 0 8px var(--violet-bright);flex-shrink:0;
  }
  @keyframes fade{to{opacity:1}}
  @keyframes pulseGlow{
    0%,100%{transform:translateX(-50%) scale(1);opacity:.5}
    50%{transform:translateX(-50%) scale(1.15);opacity:.85}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="eyebrow">Pixora · REALM · Plasma Mechanics Lab</div>
    <h1>10 variaciones de <span class="accent">METABALLS</span></h1>
    <p class="sub">
      Diferentes mecánicas, paletas, comportamientos. Toca y arrastra para
      sentir cada efecto — son <b>adictivos</b>, especialmente los reactivos a
      gravedad y los que dejan rastros persistentes. Pick uno o varios para
      shipear.
    </p>
  </div>

  <div class="grid" id="grid"></div>

</div>

<script>
'use strict';
const VS = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;
const HEAD = `
precision highp float;
uniform float uTime;
uniform vec2  uResolution;
uniform vec2  uMouse;
uniform float uPressed;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
`;
const TAU = '6.2831853';

const SHADERS = [

// ─── 1. CLASSIC FLOW (refinada) ────────────────────────────────
{
  tag: '01 · CLASSIC', name: 'Classic Flow',
  desc: '6 metaballs flotando en órbitas suaves, paleta expandida. Tonemap pro con bloom.',
  touch: 'metaball extra sigue tu dedo',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec3 col = vec3(0.01, 0.005, 0.03);
  vec2 balls[6]; vec3 cols[6]; float radii[6];
  balls[0] = vec2(0.32*cos(mod(t*0.45, ${TAU})), 0.30*sin(mod(t*0.45, ${TAU})));
  balls[1] = vec2(0.25*cos(mod(t*-0.62+2.0, ${TAU})), 0.32*sin(mod(t*-0.62+2.0, ${TAU})));
  balls[2] = vec2(0.30*cos(mod(t*0.38+4.0, ${TAU})), 0.22*sin(mod(t*0.78+4.0, ${TAU})));
  balls[3] = vec2(0.22*cos(mod(t*-0.55+1.0, ${TAU})), 0.28*sin(mod(t*-0.55+1.0, ${TAU})));
  balls[4] = vec2(0.18*cos(mod(t*0.72+3.5, ${TAU})), 0.36*sin(mod(t*0.51+3.5, ${TAU})));
  balls[5] = vec2(0.28*cos(mod(t*-0.43+5.2, ${TAU})), 0.24*sin(mod(t*0.81+5.2, ${TAU})));
  cols[0] = vec3(1.0, 0.2, 0.6); cols[1] = vec3(0.2, 0.9, 1.0);
  cols[2] = vec3(0.8, 0.3, 1.0); cols[3] = vec3(1.0, 0.7, 0.2);
  cols[4] = vec3(0.3, 1.0, 0.5); cols[5] = vec3(1.0, 0.5, 0.3);
  radii[0]=0.18; radii[1]=0.16; radii[2]=0.20; radii[3]=0.14; radii[4]=0.12; radii[5]=0.17;
  float aspect = uResolution.x/uResolution.y;
  for (int i = 0; i < 6; i++){
    float d = length((uv - balls[i]) * vec2(aspect, 1.0));
    col += cols[i] * exp(-d * 4.5) * 0.7;
  }
  vec2 mU = uMouse;
  vec2 mp = (mU*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  float md = length((uv-mp)*vec2(aspect, 1.0));
  col += vec3(1.0, 0.95, 0.9) * exp(-md*5.5) * uPressed * 1.3;
  col = col / (1.0 + col);  // tonemap
  col = pow(col, vec3(0.85));
  gl_FragColor = vec4(col, 1.0);
}`
},

// ─── 2. GRAVITY WELL ────────────────────────────────────────────
{
  tag: '02 · GRAVITY', name: 'Gravity Well',
  desc: 'Tu dedo es un <b>agujero negro</b> — todas las metaballs se atraen hacia tu posición cuando presionas.',
  touch: 'pull continuo hacia tu dedo',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec2 mp = (uMouse*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  vec3 col = vec3(0.02, 0.01, 0.04);
  float aspect = uResolution.x/uResolution.y;
  // 8 metaballs, pull toward mp when pressed
  for (int i = 0; i < 8; i++){
    float fi = float(i);
    float ang = mod(t * (0.4 + fi*0.08) + fi*0.78, ${TAU});
    float rad = 0.30 + 0.06 * sin(mod(t*0.7 + fi, ${TAU}));
    vec2 pos = vec2(cos(ang), sin(ang)) * rad;
    // Pull toward mouse when pressed
    pos = mix(pos, mp, uPressed * 0.7);
    float d = length((uv - pos) * vec2(aspect, 1.0));
    vec3 c = 0.5 + 0.5 * cos(${TAU} * (fi*0.13 + vec3(0.0, 0.33, 0.67)));
    col += c * exp(-d * 5.0) * 0.7;
  }
  // Black hole visual at mouse
  float md = length((uv-mp)*vec2(aspect, 1.0));
  col *= 1.0 - exp(-md * 6.0) * uPressed * 0.7;
  col += vec3(0.6, 0.3, 1.0) * exp(-abs(md - 0.05*uPressed)*30.0) * uPressed * 1.5;
  col = col / (1.0 + col);
  gl_FragColor = vec4(col, 1.0);
}`
},

// ─── 3. REPULSE FIELD ───────────────────────────────────────────
{
  tag: '03 · REPULSE', name: 'Repulse Field',
  desc: 'Tu dedo <b>empuja</b> las metaballs con una onda de choque visible. Ondas concéntricas radiando.',
  touch: 'shockwave radial desde tu dedo',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec2 mp = (uMouse*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  vec3 col = vec3(0.005, 0.02, 0.04);
  float aspect = uResolution.x/uResolution.y;
  for (int i = 0; i < 7; i++){
    float fi = float(i);
    float ang = mod(t * (0.35 + fi*0.07) + fi*0.95, ${TAU});
    float rad = 0.25 + 0.08 * cos(mod(t*0.6 + fi, ${TAU}));
    vec2 pos = vec2(cos(ang), sin(ang)) * rad;
    // Repulse from mouse: push pos away
    vec2 fromMouse = pos - mp;
    float pushDist = length(fromMouse);
    pos += normalize(fromMouse + 0.001) * uPressed * 0.18 / (pushDist + 0.1);
    float d = length((uv - pos) * vec2(aspect, 1.0));
    vec3 c = vec3(0.1, 0.7, 1.0) + vec3(0.4, 0.1, 0.0)*fi*0.15;
    col += c * exp(-d * 5.0) * 0.6;
  }
  // Shockwave rings
  float md = length((uv-mp)*vec2(aspect, 1.0));
  for (int i = 0; i < 3; i++){
    float r = mod(uTime*0.5 + float(i)*0.33, 1.0) * uPressed;
    col += vec3(0.4, 0.9, 1.0) * exp(-abs(md - r)*40.0) * uPressed * (1.0 - r);
  }
  col = col / (1.0 + col*0.7);
  gl_FragColor = vec4(col, 1.0);
}`
},

// ─── 4. SPAWN TRAIL ─────────────────────────────────────────────
{
  tag: '04 · TRAIL', name: 'Spawn Trail',
  desc: 'Tu dedo <b>deja un rastro</b> de metaballs que se desvanecen lentamente. Pinta con plasma.',
  touch: 'trail persistente que se desvanece',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec2 mp = (uMouse*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  vec3 col = vec3(0.01, 0.005, 0.02);
  float aspect = uResolution.x/uResolution.y;
  // 4 base metaballs
  for (int i = 0; i < 4; i++){
    float fi = float(i);
    vec2 pos = vec2(0.25*cos(mod(t*(0.4+fi*0.1)+fi, ${TAU})),
                    0.30*sin(mod(t*(0.55-fi*0.07)+fi*2.0, ${TAU})));
    float d = length((uv - pos) * vec2(aspect, 1.0));
    vec3 c = 0.5 + 0.5 * cos(${TAU} * (fi*0.25 + vec3(0.0, 0.33, 0.67)));
    col += c * exp(-d * 6.0) * 0.5;
  }
  // 8 trail metaballs at retrograde positions of mouse (fake history)
  for (int i = 0; i < 8; i++){
    float fi = float(i);
    float age = fi * 0.12;  // each older = further back
    // Trail spirals out from mouse position
    vec2 offset = vec2(sin(t*2.0 - age*5.0)*age*0.15,
                       cos(t*1.5 - age*3.0)*age*0.10);
    vec2 pos = mp + offset;
    float d = length((uv - pos) * vec2(aspect, 1.0));
    float fade = (1.0 - age * 0.9) * uPressed;
    col += vec3(1.0, 0.5, 0.9) * exp(-d * 8.0) * fade * 0.8;
  }
  col = col / (1.0 + col);
  gl_FragColor = vec4(col, 1.0);
}`
},

// ─── 5. BIPOLAR MAGNETIC ────────────────────────────────────────
{
  tag: '05 · MAGNETIC', name: 'Bipolar Magnetic',
  desc: 'Mitad <b>rojas (+)</b>, mitad <b>azules (-)</b>. Polos opuestos se atraen, iguales se repelen.',
  touch: 'tu dedo invierte polaridad local',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec2 mp = (uMouse*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  vec3 col = vec3(0.02, 0.015, 0.03);
  float aspect = uResolution.x/uResolution.y;
  for (int i = 0; i < 10; i++){
    float fi = float(i);
    bool positive = (i / 2) * 2 == i;  // even = +, odd = -
    float ang = mod(t * (0.30 + fi*0.05) + fi*0.6, ${TAU});
    // Opposite polarity orbits OPPOSITE side
    float rad = 0.32 + 0.04 * sin(mod(t*0.5 + fi, ${TAU}));
    vec2 pos = vec2(cos(ang), sin(ang)) * rad;
    if (!positive) pos = -pos * 0.9;
    // Touch: flip polarity locally (orbits invert)
    float touchInfluence = exp(-length(pos - mp)*4.0) * uPressed;
    pos = mix(pos, -pos, touchInfluence);
    float d = length((uv - pos) * vec2(aspect, 1.0));
    vec3 c = positive ? vec3(1.0, 0.15, 0.30) : vec3(0.15, 0.55, 1.0);
    col += c * exp(-d * 6.0) * 0.7;
  }
  col = col / (1.0 + col);
  gl_FragColor = vec4(col, 1.0);
}`
},

// ─── 6. LAVA LAMP ───────────────────────────────────────────────
{
  tag: '06 · CONVECTION', name: 'Lava Lamp',
  desc: 'Burbujas suben desde abajo (calientes) y bajan al enfriarse arriba. Vibe <b>orgánico, slow</b>.',
  touch: 'calientas la zona, burbujas suben rápido',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec3 col = vec3(0.10, 0.02, 0.03);
  float aspect = uResolution.x/uResolution.y;
  // Heat from bottom + touch
  vec2 mp = (uMouse*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  for (int i = 0; i < 8; i++){
    float fi = float(i);
    float cycle = mod(t * (0.20 + uPressed*0.4 + fi*0.04) + fi*0.78, 4.0);
    float y = -0.45 + cycle * 0.22;  // rises from -0.45 to ~+0.43
    float xJitter = sin(mod(t*0.5 + fi*2.0, ${TAU})) * 0.22;
    vec2 pos = vec2(xJitter + (fi-3.5)*0.05, y);
    float d = length((uv - pos) * vec2(aspect, 1.0));
    // Hot at bottom (red/orange), cool at top (yellow/cream)
    vec3 hot = vec3(1.0, 0.3, 0.1);
    vec3 cool = vec3(1.0, 0.8, 0.4);
    vec3 c = mix(hot, cool, smoothstep(-0.5, 0.5, pos.y));
    col += c * exp(-d * 5.0) * 0.9;
  }
  // Heat glow at touch
  float md = length((uv-mp)*vec2(aspect, 1.0));
  col += vec3(1.0, 0.4, 0.1) * exp(-md*4.0) * uPressed * 0.4;
  col = col / (1.0 + col*0.6);
  gl_FragColor = vec4(col, 1.0);
}`
},

// ─── 7. GALAXY SPIRAL ───────────────────────────────────────────
{
  tag: '07 · COSMIC', name: 'Galaxy Spiral',
  desc: 'Metaballs en <b>brazos espirales</b> rotando alrededor de un núcleo central brillante.',
  touch: 'el núcleo se mueve a tu dedo',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec2 mp = (uMouse*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  vec2 center = mix(vec2(0.0), mp, uPressed);
  vec3 col = vec3(0.005, 0.01, 0.03);
  float aspect = uResolution.x/uResolution.y;
  // Central bright core
  float cd = length((uv - center)*vec2(aspect, 1.0));
  col += vec3(1.0, 0.85, 0.5) * exp(-cd*15.0);
  // Spiral arms — 2 arms, each with 6 balls
  for (int i = 0; i < 12; i++){
    float fi = float(i);
    float arm = fi >= 6.0 ? 3.14159 : 0.0;
    float radial = mod(fi, 6.0) * 0.07 + 0.10;
    float spiralAng = mod(t * 0.3 + radial * 8.0 + arm, ${TAU});
    vec2 pos = center + vec2(cos(spiralAng), sin(spiralAng)) * radial;
    float d = length((uv - pos) * vec2(aspect, 1.0));
    vec3 c = mix(vec3(0.4, 0.5, 1.0), vec3(1.0, 0.4, 0.8), radial * 2.5);
    col += c * exp(-d * 7.0) * 0.5;
  }
  col = col / (1.0 + col*0.7);
  gl_FragColor = vec4(col, 1.0);
}`
},

// ─── 8. QUANTUM FOAM ────────────────────────────────────────────
{
  tag: '08 · QUANTUM', name: 'Quantum Foam',
  desc: '<b>15 metaballs micro</b> flickering caóticamente. Aparecen y desaparecen como partículas cuánticas.',
  touch: 'tu dedo estabiliza la zona (deja de flickering)',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec2 mp = (uMouse*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  vec3 col = vec3(0.015, 0.005, 0.02);
  float aspect = uResolution.x/uResolution.y;
  for (int i = 0; i < 15; i++){
    float fi = float(i);
    float seed = hash(vec2(fi, 0.0));
    float ang = mod(t*(0.6+seed*0.8)+fi*0.7, ${TAU});
    float rad = 0.20 + seed*0.18;
    vec2 pos = vec2(cos(ang), sin(ang)) * rad;
    // Flicker: only render some of the time
    float flicker = step(0.4, sin(mod(t*8.0 + fi*1.7, ${TAU}))*0.5+0.5);
    // Touch stabilizes (no flicker near mouse)
    float stab = exp(-length(pos-mp)*3.0) * uPressed;
    float visible = max(flicker, stab);
    float d = length((uv - pos) * vec2(aspect, 1.0));
    vec3 c = 0.5 + 0.5*cos(${TAU}*(seed + vec3(0.0, 0.33, 0.67)));
    col += c * exp(-d * 10.0) * 0.6 * visible;
  }
  col = col / (1.0 + col*0.5);
  gl_FragColor = vec4(col, 1.0);
}`
},

// ─── 9. MERCURY POOL ────────────────────────────────────────────
{
  tag: '09 · LIQUID METAL', name: 'Mercury Pool',
  desc: 'Metaballs <b>chrome/plata</b> con reflejos. Estética T-1000, líquido metálico denso.',
  touch: 'ondas de mercurio desde tu dedo',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec2 mp = (uMouse*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  float aspect = uResolution.x/uResolution.y;
  // Compute metaball field
  float field = 0.0;
  for (int i = 0; i < 6; i++){
    float fi = float(i);
    vec2 pos = vec2(0.30*cos(mod(t*(0.3+fi*0.05)+fi, ${TAU})),
                    0.28*sin(mod(t*(0.4-fi*0.04)+fi*2.0, ${TAU})));
    float dist = length((uv-pos)*vec2(aspect, 1.0));
    field += 0.04 / (dist*dist + 0.005);
  }
  // Touch adds a metaball
  float md = length((uv-mp)*vec2(aspect, 1.0));
  field += uPressed * 0.05 / (md*md + 0.005);
  // Chrome shading: grayscale based on field, with rim light
  float surface = smoothstep(0.8, 1.3, field);
  float rim = smoothstep(0.8, 0.85, field) - smoothstep(0.85, 0.95, field);
  vec3 col = vec3(0.05, 0.07, 0.10);
  col = mix(col, vec3(0.55, 0.65, 0.75), surface);
  col += vec3(0.9, 0.95, 1.0) * rim * 0.8;
  // Reflection-like highlight
  float highlight = pow(max(0.0, dot(normalize(vec2(0.5, 0.7)), uv)), 4.0);
  col += vec3(0.9, 0.95, 1.0) * highlight * surface * 0.3;
  gl_FragColor = vec4(col, 1.0);
}`
},

// ─── 10. NEON LIQUID ────────────────────────────────────────────
{
  tag: '10 · CYBER', name: 'Neon Liquid',
  desc: 'Metaballs <b>neón cyberpunk</b> con outline brillante. Donde se fusionan, el outline pinta el contorno.',
  touch: 'metaball gigante neón sigue tu dedo',
  fs: `${HEAD}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  float t = mod(uTime, 60.0);
  vec2 mp = (uMouse*uResolution.xy - 0.5*uResolution.xy)/uResolution.y;
  float aspect = uResolution.x/uResolution.y;
  float field = 0.0;
  for (int i = 0; i < 5; i++){
    float fi = float(i);
    vec2 pos = vec2(0.25*cos(mod(t*(0.4+fi*0.07)+fi*1.3, ${TAU})),
                    0.32*sin(mod(t*(0.5-fi*0.06)+fi*1.7, ${TAU})));
    float dist = length((uv-pos)*vec2(aspect, 1.0));
    field += 0.05 / (dist*dist + 0.005);
  }
  float md = length((uv-mp)*vec2(aspect, 1.0));
  field += uPressed * 0.10 / (md*md + 0.005);
  // Color cycles with time
  vec3 hue = 0.5 + 0.5 * cos(${TAU} * (t*0.05 + vec3(0.0, 0.33, 0.67)));
  // Sharp edge for the "outline"
  float fill = smoothstep(0.9, 1.2, field);
  float outline = smoothstep(0.85, 0.95, field) - smoothstep(0.95, 1.05, field);
  vec3 col = vec3(0.005, 0.005, 0.02);
  col = mix(col, hue * 0.4, fill);
  col += hue * outline * 2.5;
  col += hue * exp(-(field - 1.0)*(field - 1.0) * 20.0) * 0.3;  // glow
  gl_FragColor = vec4(col, 1.0);
}`
},

];

class ShaderCanvas {
  constructor(canvas, fragSrc){
    this.canvas = canvas;
    this.gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!this.gl) return;
    this.startTime = performance.now();
    this.mouse = [0.5, 0.5]; this.pressed = 0; this.targetPressed = 0;
    this.compile(fragSrc); this.setupGeometry(); this.setupSize(); this.bindEvents();
    this.running = false;
  }
  compile(fragSrc){
    const gl = this.gl;
    const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, VS); gl.compileShader(vs);
    const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, fragSrc); gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) console.error('FS:', gl.getShaderInfoLog(fs), '\n', fragSrc);
    const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    this.prog = p;
    this.uTime = gl.getUniformLocation(p, 'uTime');
    this.uRes = gl.getUniformLocation(p, 'uResolution');
    this.uMouse = gl.getUniformLocation(p, 'uMouse');
    this.uPressed = gl.getUniformLocation(p, 'uPressed');
    this.aPos = gl.getAttribLocation(p, 'aPos');
  }
  setupGeometry(){
    const gl = this.gl;
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(this.aPos);
    gl.vertexAttribPointer(this.aPos, 2, gl.FLOAT, false, 0, 0);
  }
  setupSize(){
    const rect = this.canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.floor(rect.width * dpr);
    this.canvas.height = Math.floor(rect.height * dpr);
    this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
  }
  bindEvents(){
    const setMouse = (e) => {
      const rect = this.canvas.getBoundingClientRect();
      let cx, cy;
      if (e.touches && e.touches.length){ cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
      else { cx = e.clientX; cy = e.clientY; }
      this.mouse[0] = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
      this.mouse[1] = Math.max(0, Math.min(1, 1 - (cy - rect.top) / rect.height));
    };
    this.canvas.addEventListener('mousedown', e => { setMouse(e); this.targetPressed = 1; });
    this.canvas.addEventListener('mousemove', setMouse);
    window.addEventListener('mouseup', () => this.targetPressed = 0);
    this.canvas.addEventListener('touchstart', e => { e.preventDefault(); setMouse(e); this.targetPressed = 1; }, { passive: false });
    this.canvas.addEventListener('touchmove', e => { e.preventDefault(); setMouse(e); }, { passive: false });
    this.canvas.addEventListener('touchend', () => this.targetPressed = 0);
    window.addEventListener('resize', () => this.setupSize());
  }
  start(){
    if (this.running) return; this.running = true;
    const loop = () => { if (!this.running) return; this.draw(); this.rafId = requestAnimationFrame(loop); };
    loop();
  }
  stop(){ this.running = false; if (this.rafId) cancelAnimationFrame(this.rafId); }
  draw(){
    const gl = this.gl;
    this.pressed += (this.targetPressed - this.pressed) * 0.12;
    const tSec = ((performance.now() - this.startTime) / 1000) % 60.0;
    gl.useProgram(this.prog);
    gl.uniform1f(this.uTime, tSec);
    gl.uniform2f(this.uRes, this.canvas.width, this.canvas.height);
    gl.uniform2f(this.uMouse, this.mouse[0], this.mouse[1]);
    gl.uniform1f(this.uPressed, this.pressed);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
}

const grid = document.getElementById('grid');
const instances = [];
SHADERS.forEach(s => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <span class="card-tag">${s.tag}</span>
      <span class="card-name">${s.name}</span>
    </div>
    <div class="phone"><canvas></canvas></div>
    <p class="card-desc">${s.desc}</p>
    <div class="touch-note">${s.touch}</div>
  `;
  grid.appendChild(card);
  const canvas = card.querySelector('canvas');
  requestAnimationFrame(() => {
    const sc = new ShaderCanvas(canvas, s.fs);
    instances.push(sc);
    const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? sc.start() : sc.stop()), { threshold: 0.05 });
    io.observe(canvas);
  });
});
window.addEventListener('resize', () => instances.forEach(sc => sc.setupSize()));
</script>
