<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<title>D · Arc Browser Soft</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#1a1a1a; min-height:100vh; padding:30px; display:flex; flex-direction:column; align-items:center; gap:20px; }
.dir-label { color:#ff7a5c; font-weight:800; font-size:18px; letter-spacing:-0.02em; }
.dir-label::before { content:"D · "; color:#888; font-weight:500; letter-spacing:0.25em; text-transform:uppercase; font-size:11px; }
.pair { display:flex; gap:18px; }
.mode-wrap { display:flex; flex-direction:column; gap:8px; align-items:center; }
.mode-label { font-size:10px; letter-spacing:0.25em; color:#888; text-transform:uppercase; font-weight:500; }
.phone {
  width:320px; height:680px; overflow:hidden; border-radius:30px; position:relative;
  --bg:#0e0c15; --surface:rgba(255,255,255,0.04); --text:#eae6f0; --text-dim:#8a8595; --accent:#ff7a5c; --accent-2:#ffa674; --divider:rgba(234,230,240,0.1);
  color:var(--text);
  background: var(--bg);
  background-image: radial-gradient(circle 500px at 20% -10%, rgba(255,122,92,0.22), transparent 60%), radial-gradient(circle 400px at 100% 80%, rgba(255,166,116,0.18), transparent 60%);
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
}
.phone.light {
  --bg:#f6f1ea; --surface:rgba(26,20,15,0.04); --text:#1a140f; --text-dim:#7a7060; --accent:#d9512f; --accent-2:#e8783d; --divider:rgba(26,20,15,0.08);
  background: var(--bg);
  background-image: radial-gradient(circle 500px at 20% -10%, rgba(217,81,47,0.15), transparent 60%), radial-gradient(circle 400px at 100% 80%, rgba(232,120,61,0.12), transparent 60%);
}
.notch { height:28px; display:flex; justify-content:space-between; padding:10px 22px 0; font-size:11px; font-weight:600; position:relative; z-index:1; }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:14px 18px 10px; position:relative; z-index:1; }
.avatar { width:30px; height:30px; border-radius:10px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; }
.brand { font-weight:800; font-size:19px; letter-spacing:-0.03em; }
.brand em { font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; font-size:21px; color:var(--accent); }
.pill { padding:5px 12px; border-radius:100px; background:var(--surface); border:1px solid var(--divider); font-size:12px; font-weight:600; display:flex; align-items:center; gap:5px; backdrop-filter:blur(10px); }
.hero { margin:14px 16px 0; border-radius:22px; overflow:hidden; position:relative; height:270px; border:1px solid var(--divider); }
.hero img { width:100%; height:100%; object-fit:cover; }
.hero::after { content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(14,12,21,0.92), transparent 50%); }
.hero-body { position:absolute; bottom:14px; left:14px; right:14px; color:#fff; z-index:2; }
.hero-tag { display:inline-block; padding:4px 10px; border:1px solid rgba(255,255,255,0.3); border-radius:100px; font-size:9px; font-weight:600; letter-spacing:0.1em; margin-bottom:8px; backdrop-filter:blur(10px); }
.hero-title { font-family:'Instrument Serif',serif; font-weight:400; font-size:30px; line-height:1; letter-spacing:-0.02em; margin-bottom:6px; }
.hero-title em { font-style:italic; color:var(--accent-2); }
.hero-desc { font-size:11px; opacity:0.75; line-height:1.4; }
.section { padding:22px 18px 0; position:relative; z-index:1; }
.section-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
.section-title { font-weight:700; font-size:17px; letter-spacing:-0.02em; }
.section-title em { font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; color:var(--accent); }
.more { font-size:11px; font-weight:600; color:var(--accent); }
.row { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
.card { min-width:110px; }
.card-img { width:110px; height:150px; border-radius:16px; overflow:hidden; position:relative; background:var(--surface); border:1px solid var(--divider); }
.card-img img { width:100%; height:100%; object-fit:cover; }
.card-badge { position:absolute; top:6px; left:6px; background:var(--accent); color:#fff; padding:2px 7px; border-radius:100px; font-size:8px; font-weight:700; letter-spacing:0.08em; }
.card-title { margin-top:6px; font-size:11px; font-weight:600; }
.nav { position:absolute; bottom:10px; left:16px; right:16px; padding:7px 6px; background:var(--surface); border:1px solid var(--divider); border-radius:24px; display:flex; justify-content:space-around; backdrop-filter:blur(20px); }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:1px; font-size:8px; font-weight:600; color:var(--text-dim); flex:1; padding:4px 2px; border-radius:14px; }
.nav-item.active { color:#fff; background:var(--accent); }
.nav-icon { font-size:13px; font-weight:700; }
</style></head><body>
<div class="dir-label">Arc Browser soft gradients</div>
<div class="pair">
  <template id="ph">
    <div class="notch"><span>9:41</span><span>●●○</span></div>
    <div class="topbar"><div style="display:flex; align-items:center; gap:10px;"><div class="avatar">E</div><div class="brand">Pix<em>ora</em></div></div><div class="pill">◆ 120</div></div>
    <div class="hero"><img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=400&q=80">
      <div class="hero-body"><div class="hero-tag">NATURE</div><div class="hero-title">Enchanted<em> forest</em></div><div class="hero-desc">Moonlit, animated fireflies drifting through mossy ancient trees.</div></div>
    </div>
    <div class="section"><div class="section-head"><div class="section-title">Trending<em> now</em></div><div class="more">ver →</div></div>
      <div class="row">
        <div class="card"><div class="card-img"><img src="https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?w=200&q=80"></div><div class="card-title">2B Automata</div></div>
        <div class="card"><div class="card-img"><span class="card-badge">NEW</span><img src="https://images.unsplash.com/photo-1517457373958-b7bdd4587205?w=200&q=80"></div><div class="card-title">Saga Géminis</div></div>
        <div class="card"><div class="card-img"><img src="https://images.unsplash.com/photo-1542736667-069246bdbc6d?w=200&q=80"></div><div class="card-title">Aku</div></div>
      </div>
    </div>
    <div class="nav">
      <div class="nav-item active"><div class="nav-icon">◉</div>Wall</div>
      <div class="nav-item"><div class="nav-icon">▸</div>Live</div>
      <div class="nav-item"><div class="nav-icon">☽</div>Aura</div>
      <div class="nav-item"><div class="nav-icon">❒</div>Stor</div>
      <div class="nav-item"><div class="nav-icon">♪</div>Ton</div>
      <div class="nav-item"><div class="nav-icon">✦</div>IA</div>
      <div class="nav-item"><div class="nav-icon">♡</div>Fav</div>
    </div>
  </template>
  <div class="mode-wrap"><div class="mode-label">Día</div><div class="phone light" id="pl"></div></div>
  <div class="mode-wrap"><div class="mode-label">Noche</div><div class="phone" id="pd"></div></div>
</div>
<script>const t=document.getElementById('ph').innerHTML; pl.innerHTML=t; pd.innerHTML=t;</script>
</body></html>
