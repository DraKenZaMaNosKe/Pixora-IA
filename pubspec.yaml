name: pixora
description: "Pixora IA - Wallpapers, Ringtones & Icon Packs"
publish_to: 'none'
version: 1.5.6+22

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  hive_flutter: ^1.1.0
  http: ^1.2.1
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  permission_handler: ^11.3.0
  flutter_cache_manager: ^3.3.2
  intl: any
  google_mobile_ads: ^5.2.0
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.1
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  video_player: ^2.9.2

dependency_overrides:
  win32: 5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_p.png"
  adaptive_icon_background: "#050508"
  adaptive_icon_foreground: "assets/icon_p.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
