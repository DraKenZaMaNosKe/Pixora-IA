name: pixora
description: "Pixora IA - Wallpapers, Ringtones & Icon Packs"
publish_to: 'none'
version: 1.7.58+101

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  http: ^1.2.1
  path: ^1.9.0
  path_provider: ^2.1.3
  share_plus: ^12.0.2
  permission_handler: ^12.0.0
  connectivity_plus: ^6.0.5
  flutter_cache_manager: ^3.3.2
  intl: any
  google_mobile_ads: ^8.0.0
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.1
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  video_player: ^2.9.2
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.2
  archive: ^4.0.2
  in_app_purchase: ^3.2.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  # Firebase (added 2026-05-11 — FCM push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  # Free Hour scheduled notifications (zonedSchedule needs timezone data +
  # the device's local zone).
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dependency_overrides:
  win32: 5.5.5
  webview_flutter_android: ^4.0.0
  google_sign_in_android: ^6.1.33
  path_provider_android: ^2.2.12
  shared_preferences_android: ^2.4.0
  url_launcher_android: ^6.3.14
  video_player_android: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_p.png"
  adaptive_icon_background: "#050508"
  adaptive_icon_foreground: "assets/icon_p.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Variable.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist/GeistMono-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains/JetBrainsMono-Variable.ttf
